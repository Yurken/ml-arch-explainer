            ${concepts.length ? concepts.map((c) => `
              <div class="concept-card">
                <div class="concept-term">${renderInlineMath(c.term || "")}</div>
                <p class="concept-brief">${renderInlineMath(c.brief || "")}</p>
              </div>
            `).join("") : `<p class="prose" style="color:var(--text-muted);">该模块无额外前置概念条目。</p>`}
          </div>
        ` : ""}
        ${papers.length || !omitEmpty ? `
          <div class="section-block">
            <h4 class="section-label">关联论文与方法谱系</h4>
            ${papers.length ? papers.map(renderPaperCard).join("") : `<p class="prose" style="color:var(--text-muted);">暂未关联特定论文。</p>`}
          </div>
        ` : ""}
      `;
    }

    function buildEvidenceHtml(node) {
      if (!node.evidence || !node.evidence.length) return "";
      const labels = { paper: "正文定义", figure: "图中可见", experiment: "实验报告", inference: "解读推断" };
      const entries = node.evidence.map((e) => `
        <div class="ev-item">
          <div class="ev-head">
            <span class="ev-kind ${e.kind === "inference" ? "inference" : ""}">${labels[e.kind] || e.kind}</span>
            <span class="ev-locator">${renderInlineMath(e.locator)}</span>
          </div>
          <div>${renderInlineMath(e.claim)}</div>
        </div>
      `).join("");
      return `
        <div class="section-block">
          <details class="evidence-box" open>
            <summary>
              <span>原文依据与解读标注（${node.evidence.length} 条）</span>
              <span style="font-size:11.5px; color:var(--text-muted);">展开 / 收起</span>
            </summary>
            ${entries}
          </details>
        </div>
      `;
    }

    function renderInspector() {
      const node = state.nodeMap.get(state.selectedNodeId);
      if (!node) return;
      const st = getCategoryStyle(node.category);
      const idx = state.sortedNodes.findIndex((n) => n.id === node.id);

      document.getElementById("btnPrevNode").disabled = idx <= 0;
      document.getElementById("btnNextNode").disabled = idx >= state.sortedNodes.length - 1;

      document.getElementById("inspectorCategory").innerHTML = `
        <span class="cat-pill" style="background:${st.fill}; color:${st.stroke}; border:1px solid ${st.stroke}44;">
          S${node.stage} · ${escapeHtml(st.label)}
          ${node.repeat_badge ? ` · ${renderInlineMath(node.repeat_badge)}` : ""}
        </span>
      `;
      document.getElementById("inspectorTitle").innerHTML = renderInlineMath(node.name || "");
      document.getElementById("inspectorRole").innerHTML = renderInlineMath(node.role || "");

      const io = node.io || {};
      document.getElementById("inspectorIO").innerHTML = `
        <div>
          <div class="io-col-label">输入 Input</div>
          ${formatIOList(io.inputs)}
        </div>
        <div class="io-arrow">→</div>
        <div>
          <div class="io-col-label">输出 Output</div>
          ${formatIOList(io.outputs)}
        </div>
      `;

      const body = document.getElementById("inspectorBody");
      if (state.activeTab === "all") {
        body.innerHTML =
          buildMechanicsHtml(node) +
          buildRationaleHtml(node) +
          buildKnowledgeHtml(node, true) +
          buildEvidenceHtml(node);
      } else if (state.activeTab === "mechanics") {
        body.innerHTML = buildMechanicsHtml(node) + buildEvidenceHtml(node);
      } else if (state.activeTab === "rationale") {
        body.innerHTML = (buildRationaleHtml(node) || `<p class="prose" style="color:var(--text-muted);">暂无设计动机补充。</p>`) + buildEvidenceHtml(node);
      } else {
        body.innerHTML = buildKnowledgeHtml(node, false);
      }
    }

    function renderReaderView() {
      const toc = document.getElementById("readerTocList");
      const article = document.getElementById("readerArticle");

      toc.innerHTML = state.sortedNodes.map((n) => `
        <a class="toc-link" href="#reader-node-${escapeHtml(n.id)}">
          <span class="toc-stage">S${n.stage}</span>
          <span>${renderInlineMath(n.short_name || n.name)}</span>
        </a>
      `).join("") + `<a class="toc-link" href="#overviewCard"><span class="toc-stage">表</span><span>端到端张量追踪</span></a>`;

      const figHtml = IMAGE_DATA_URI ? `
        <div class="reader-figure-card">
          <img src="${IMAGE_DATA_URI}" alt="Original Architecture Diagram" onclick="openLightbox()" />
          <div style="font-size:12.5px; color:var(--text-muted); margin-top:8px;">原始架构图（点击放大查看原尺寸）</div>
        </div>
      ` : "";

      const cardsHtml = state.sortedNodes.map((node) => {
        const st = getCategoryStyle(node.category);
        const io = node.io || {};
        return `
          <section class="reader-card" id="reader-node-${escapeHtml(node.id)}">
            <div class="reader-card-head">
              <span class="cat-pill" style="background:${st.fill}; color:${st.stroke}; border:1px solid ${st.stroke}44;">
                Stage ${node.stage} · ${escapeHtml(st.label)}${node.repeat_badge ? ` · ${renderInlineMath(node.repeat_badge)}` : ""}
              </span>
              <button class="btn btn-sm" data-node="${escapeHtml(node.id)}" data-locate="true">在交互图中定位 ↗</button>
            </div>
            <h2>${renderInlineMath(node.name)}</h2>
            <p class="inspector-role">${renderInlineMath(node.role || "")}</p>
            <div class="io-strip" style="margin-bottom:18px;">
              <div><div class="io-col-label">输入 Input</div>${formatIOList(io.inputs)}</div>
              <div class="io-arrow">→</div>
              <div><div class="io-col-label">输出 Output</div>${formatIOList(io.outputs)}</div>
            </div>
            ${buildMechanicsHtml(node)}
            ${buildRationaleHtml(node)}
            ${buildKnowledgeHtml(node, true)}
            ${buildEvidenceHtml(node)}
          </section>
        `;
      }).join("");

      article.innerHTML = figHtml + cardsHtml;
    }

    function renderPaperCard(p) {
      const rel = RELATION_LABEL[p.relation] || RELATION_LABEL.foundational;
      const verifiedBadge = p.verified
        ? `<span class="verify-pill verified">已核验链接</span>`
        : `<span class="verify-pill search">检索入口</span>`;
      const safeUrl =
        p.url ||
        `https://arxiv.org/search/?query=${encodeURIComponent(p.title || "")}&searchtype=all`;
      return `
        <div class="paper-card">
          <div class="paper-top">
            <div class="paper-title">${renderInlineMath(p.title || "")}</div>
            <span class="rel-badge ${rel.cls}">${rel.text}</span>
          </div>
          <div class="paper-meta">
            <span>${renderInlineMath(p.authors_year || "")}</span>
            ${verifiedBadge}
          </div>
          ${p.takeaway ? `<p class="paper-takeaway">${renderInlineMath(p.takeaway)}</p>` : ""}
          <a class="paper-link" href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer">
            ${p.verified ? "打开论文页面 ↗" : "在学术库中检索该论文 ↗"}
          </a>
        </div>
      `;
    }

    /* ---------------- Appendix ---------------- */
    function renderAppendix() {
      const m = ARCH_DATA.meta || {};
      document.getElementById("overviewSummary").innerHTML = renderInlineMath(m.overview_summary || "");

      document.getElementById("traceTableBody").innerHTML = state.sortedNodes
        .map((n) => {
          const ins = ((n.io && n.io.inputs) || []).map((x) => [renderInlineMath(x.name), renderSymbol(x.shape)].filter(Boolean).join(" ")).join("<br/>") || "—";
          const outs = ((n.io && n.io.outputs) || []).map((x) => [renderInlineMath(x.name), renderSymbol(x.shape)].filter(Boolean).join(" ")).join("<br/>") || "—";
          return `
            <tr data-node="${escapeHtml(n.id)}">
              <td class="mono">S${n.stage}</td>
              <td><button type="button" class="trace-node-link">${renderInlineMath(n.name)}</button></td>
              <td class="mono">${ins}</td>
              <td class="mono" style="color:var(--accent);">${outs}</td>
              <td>${renderInlineMath(n.role || "")}</td>
            </tr>
          `;
        })
        .join("");

      const seen = new Set();
      const allPapers = [];
      ARCH_DATA.nodes.forEach((n) => {
        (n.papers || []).forEach((p) => {
          const key = (p.title || "").trim().toLowerCase();
          if (key && !seen.has(key)) {
            seen.add(key);
            allPapers.push(p);
          }
        });
      });
      document.getElementById("bibList").innerHTML = allPapers.length
        ? allPapers.map(renderPaperCard).join("")
        : `<p class="prose" style="color:var(--text-muted);">暂无关联论文条目。</p>`;

      const glossary = ARCH_DATA.symbol_glossary || [];
      document.getElementById("glossaryGrid").innerHTML = glossary.length
        ? glossary.map((g) => `
            <div class="glossary-item">
              <span class="glossary-sym">${renderSymbol(g.symbol)}</span>
              <span style="font-size:13.5px; color:var(--text-secondary); line-height:1.55;">${renderInlineMath(g.meaning)}</span>
            </div>
          `).join("")
        : `<p class="prose" style="color:var(--text-muted);">无额外符号定义。</p>`;

      const uncs = m.uncertainties || [];
      if (uncs.length) {
        document.getElementById("uncertaintyWrap").style.display = "block";
        document.getElementById("uncertaintyList").innerHTML =
          `<ul class="bullet-list" style="margin:0;">${uncs.map((u) => `<li>${renderInlineMath(u)}</li>`).join("")}</ul>`;
      }
    }

    function openLightbox() {
      if (!IMAGE_DATA_URI) return;
      document.getElementById("lightbox").classList.add("open");
    }
    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("open");
    }

    window.addEventListener("keydown", (e) => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA")) return;
      if (e.key === "Escape") closeLightbox();
      if (state.walkthrough && e.key === "ArrowRight") goStep(state.stepIndex + 1);
      if (state.walkthrough && e.key === "ArrowLeft") goStep(state.stepIndex - 1);
    });

    init();
  </script>
</body>
</html>
