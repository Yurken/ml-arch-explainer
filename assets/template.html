<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__PAGE_TITLE__ · 架构深度精读</title>
  <!--__KATEX_BUNDLE__-->
  <style>
    :root {
      --bg-paper: #FAF9F5;
      --bg-card: #FFFFFF;
      --bg-subtle: #F2F0E9;
      --bg-code: #F6F5F0;
      --bg-canvas: #FDFCF9;
      --canvas-dot: #E2DFD5;
      --border: #E4E1D8;
      --border-strong: #C9C4B7;
      --text-primary: #181C20;
      --text-secondary: #3D4550;
      --text-muted: #5F6975;
      --accent: #24477A;
      --accent-hover: #1B3760;
      --accent-soft: #EBF1FA;
      --amber: #A14A07;
      --amber-bg: #FFF9EE;
      --amber-border: #F2D7A8;
      --crimson: #B42318;
      --emerald: #067647;
      --shadow-sm: 0 1px 2px rgba(24, 28, 32, 0.05);
      --shadow-md: 0 10px 28px rgba(24, 28, 32, 0.08);
      --font-serif: "Source Serif 4", "Noto Serif SC", Georgia, "Songti SC", serif;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --radius: 10px;
      --pill-bg: #FFFFFF;
      --pill-text: #273240;
    }

    html[data-theme="dark"] {
      --bg-paper: #12151A;
      --bg-card: #191D24;
      --bg-subtle: #222832;
      --bg-code: #151920;
      --bg-canvas: #14181F;
      --canvas-dot: #29303B;
      --border: #2C3340;
      --border-strong: #3E4859;
      --text-primary: #ECEFF4;
      --text-secondary: #C4CCD6;
      --text-muted: #929DAD;
      --accent: #74A9F7;
      --accent-hover: #96BFFA;
      --accent-soft: rgba(116, 169, 247, 0.14);
      --amber: #F5B461;
      --amber-bg: rgba(245, 180, 97, 0.1);
      --amber-border: rgba(245, 180, 97, 0.35);
      --crimson: #F87171;
      --emerald: #34D399;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.45);
      --pill-bg: #1F2530;
      --pill-text: #DCE3EC;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-paper);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15.5px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Compact Editorial Masthead */
    .masthead {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 18px 28px 16px;
    }
    .masthead-inner {
      max-width: 1560px;
      margin: 0 auto;
    }
    .kicker-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .kicker-badge {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 600;
    }
    .source-paper-bar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 10px;
      margin: 0 0 10px;
      line-height: 1.45;
    }
    .title {
      font-family: var(--font-serif);
      font-size: clamp(22px, 2.3vw, 31px);
      font-weight: 700;
      line-height: 1.26;
      margin: 0 0 4px;
      color: var(--text-primary);
    }
    .subtitle {
      font-family: var(--font-serif);
      font-size: 15.5px;
      color: var(--text-secondary);
      margin: 0 0 12px;
      line-height: 1.5;
    }
    .core-insight {
      margin: 0 0 14px;
      padding: 11px 16px;
      border-left: 3.5px solid var(--accent);
      background: var(--bg-paper);
      border-radius: 0 8px 8px 0;
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-primary);
    }
    .core-insight strong {
      color: var(--accent);
      font-weight: 600;
      margin-right: 8px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .tag {
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      padding: 2px 9px;
      border-radius: 999px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .segmented {
      display: inline-flex;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .segmented .btn {
      border: none;
      background: transparent;
      padding: 5px 11px;
      border-radius: 6px;
    }
    .segmented .btn.active {
      background: var(--bg-card);
      color: var(--accent);
      box-shadow: var(--shadow-sm);
      font-weight: 600;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      line-height: 1.3;
    }
    .btn:hover { background: var(--bg-subtle); border-color: var(--accent); }
    .btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-sm {
      padding: 4px 9px;
      font-size: 12.5px;
      border-radius: 6px;
    }

    /* Quick Module Navigation Strip */
    .module-rail-wrap {
      max-width: 1560px;
      margin: 14px auto 0;
      padding: 0 28px;
    }
    .module-rail {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      scrollbar-width: thin;
    }
    .rail-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      margin-right: 4px;
    }
    .rail-chip {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-paper);
      color: var(--text-secondary);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12.5px;
      font-family: var(--font-sans);
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .rail-chip:hover { border-color: var(--accent); color: var(--accent); }
    .rail-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
      font-weight: 600;
    }
    .rail-stage {
      font-family: var(--font-mono);
      font-size: 11px;
      opacity: 0.78;
    }

    /* Explore Workspace */
    .workspace {
      max-width: 1560px;
      margin: 14px auto 0;
      padding: 0 28px;
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(440px, 1fr);
      gap: 20px;
      align-items: start;
    }
    .workspace.workspace-wide {
      grid-template-columns: 1fr;
    }
    @media (max-width: 1180px) {
      .workspace { grid-template-columns: 1fr; padding: 0 16px; }
      .module-rail-wrap { padding: 0 16px; }
      .masthead { padding: 16px; }
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    /* Left Canvas Panel */
    .canvas-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }
    .canvas-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .zoom-badge {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg-subtle);
      padding: 2px 7px;
      border-radius: 5px;
    }
    .canvas-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }

    .canvas-stage {
      position: relative;
      height: 580px;
      background:
        radial-gradient(var(--canvas-dot) 1px, transparent 1px) 0 0 / 22px 22px,
        var(--bg-canvas);
      overflow: hidden;
      user-select: none;
    }
    .canvas-stage.split-mode {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      height: 600px;
    }
    @media (max-width: 900px) {
      .canvas-stage.split-mode {
        grid-template-columns: 1fr;
        grid-template-rows: 360px 320px;
        height: auto;
      }
    }
    .svg-viewport {
      width: 100%;
      height: 100%;
      cursor: grab;
      overflow: hidden;
      position: relative;
    }
    .svg-viewport:active { cursor: grabbing; }
    .svg-viewport > svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .orig-image-pane {
      width: 100%;
      height: 100%;
      background: var(--bg-subtle);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: auto;
      position: relative;
    }
    .canvas-stage.split-mode .orig-image-pane {
      border-left: 1px solid var(--border);
    }
    @media (max-width: 900px) {
      .canvas-stage.split-mode .orig-image-pane {
        border-left: none;
        border-top: 1px solid var(--border);
      }
    }
    .orig-image-pane img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: var(--shadow-sm);
      background: #FFFFFF;
      cursor: zoom-in;
    }
    .orig-caption {
      position: absolute;
      top: 10px;
      left: 12px;
      font-size: 11.5px;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 2px 9px;
      border-radius: 999px;
      box-shadow: var(--shadow-sm);
    }

    /* Legend bar */
    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 12px;
      color: var(--text-muted);
    }
    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .legend-line {
      width: 22px;
      height: 0;
      border-top: 2px solid #475569;
      display: inline-block;
    }
    .legend-line.residual { border-top: 2px dashed #4F46E5; }
    .legend-line.conditioning { border-top: 2px dotted #B45309; }
    .legend-line.loss { border-top: 2px dashed #B91C1C; }

    /* Collapsible Stepper */
    .stepper {
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      background: var(--bg-paper);
    }
    .stepper-collapsed {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .stepper-expanded {
      padding-top: 2px;
    }
    .stepper-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .step-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .step-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 9px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .step-title {
      font-weight: 600;
      font-size: 14.5px;
      color: var(--text-primary);
    }
    .step-narration {
      font-size: 14.5px;
      color: var(--text-secondary);
      margin: 0 0 10px;
      line-height: 1.65;
    }
    .step-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .step-select {
      flex: 1;
      max-width: 340px;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 13px;
      font-family: var(--font-sans);
    }
    .step-progress {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .step-progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.2s ease;
    }

    /* SVG Nodes & Edges */
    .arch-node { cursor: pointer; transition: opacity 0.2s ease; }
    .arch-node.dimmed { opacity: 0.28; }
    .arch-node .node-box {
      transition: filter 0.15s ease, stroke-width 0.15s ease;
    }
    .arch-node:hover .node-box {
      filter: drop-shadow(0 5px 12px rgba(24, 34, 48, 0.14));
    }
    .arch-node.selected .node-box {
      stroke-width: 2.8px;
      filter: drop-shadow(0 6px 16px rgba(36, 71, 122, 0.28));
    }
    .arch-edge { transition: opacity 0.2s ease; }
    .arch-edge.dimmed { opacity: 0.14; }
    .arch-edge.muted-edge { opacity: 0.42; }
    .arch-edge .edge-pill { transition: opacity 0.15s ease; }
    .arch-edge.hide-pill .edge-pill { opacity: 0; pointer-events: none; }
    .arch-edge.hide-pill:hover .edge-pill { opacity: 1; }
    .arch-edge.active-flow path.edge-path {
      stroke-dasharray: 8 5;
      animation: flowDash 0.9s linear infinite;
      stroke-width: 2.6px;
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -26; }
    }

    /* Right Inspector Panel — Comfortable Editorial Reading */
    .inspector {
      display: flex;
      flex-direction: column;
    }
    .inspector-head {
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }
    .inspector-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .cat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 999px;
    }
    .inspector-title {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      margin: 0 0 6px;
      color: var(--text-primary);
    }
    .inspector-role {
      font-size: 14.5px;
      color: var(--text-secondary);
      margin: 0 0 14px;
      line-height: 1.6;
    }

    /* Redesigned Tensor IO Chips */
    .io-strip {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      background: var(--bg-paper);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .io-col-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .io-chips {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .io-chip {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 5px;
      font-size: 12.5px;
      line-height: 1.4;
      color: var(--text-primary);
    }
    .io-shape {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 500;
    }
    .io-dtype {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }
    .io-arrow {
      color: var(--text-muted);
      font-size: 18px;
      text-align: center;
      font-weight: 600;
    }

    /* Tabs */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      background: var(--bg-paper);
      padding: 0 18px;
      gap: 4px;
    }
    .tab-btn {
      appearance: none;
      border: none;
      background: transparent;
      padding: 10px 12px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      font-family: var(--font-sans);
      transition: color 0.15s;
    }
    .tab-btn:hover { color: var(--text-primary); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    .inspector-body {
      padding: 20px 22px 24px;
    }
    .section-block {
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px dashed var(--border);
    }
    .section-block:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }
    .section-label {
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--accent);
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .prose {
      font-size: 15px;
      color: var(--text-primary);
      margin: 0;
      line-height: 1.8;
    }
    .formula-box {
      background: var(--bg-paper);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 16px;
      overflow-x: auto;
      text-align: center;
      margin-bottom: 12px;
    }
    .formula-box .katex-display {
      margin: 0;
      font-size: 1.04em;
    }
    .formula-fallback {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-primary);
    }
    .bullet-list {
      margin: 0;
      padding-left: 20px;
      color: var(--text-secondary);
      font-size: 14.5px;
      line-height: 1.75;
    }
    .bullet-list li { margin-bottom: 7px; }
    .bullet-list li:last-child { margin-bottom: 0; }

    pre.code-block {
      margin: 0;
      padding: 14px 16px;
      background: var(--bg-code);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.65;
      color: var(--text-primary);
      overflow-x: auto;
      white-space: pre;
    }

    .callout {
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-paper);
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--text-secondary);
    }
    .callout.warn {
      border-color: var(--amber-border);
      background: var(--amber-bg);
      color: var(--amber);
    }

    /* Evidence Collapsible */
    details.evidence-box {
      background: var(--bg-paper);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
    }
    details.evidence-box summary {
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    details.evidence-box summary::-webkit-details-marker { display: none; }
    details.evidence-box[open] summary { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .ev-item {
      margin-bottom: 10px;
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text-secondary);
    }
    .ev-item:last-child { margin-bottom: 0; }
    .ev-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .ev-kind {
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .ev-kind.inference { background: var(--amber-bg); color: var(--amber); }
    .ev-locator {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Concept & Paper cards */
    .concept-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      margin-bottom: 9px;
      background: var(--bg-paper);
    }
    .concept-term {
      font-weight: 600;
      font-size: 14.5px;
      color: var(--text-primary);
      margin-bottom: 3px;
    }
    .concept-brief {
      font-size: 14px;
      color: var(--text-secondary);
      margin: 0;
      line-height: 1.65;
    }

    .paper-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 13px 15px;
      margin-bottom: 10px;
      background: var(--bg-card);
      transition: border-color 0.15s;
    }
    .paper-card:hover { border-color: var(--accent); }
    .paper-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .paper-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 15px;
      color: var(--text-primary);
      line-height: 1.38;
    }
    .rel-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .rel-foundational { background: #EEF2FF; color: #3730A3; }
    .rel-direct_predecessor { background: #FEF3C7; color: #92400E; }
    .rel-alternative { background: #F0FDFA; color: #0F766E; }
    .rel-follow_up { background: #F5F3FF; color: #6D28D9; }
    .paper-meta {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .verify-pill {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .verify-pill.verified { background: #ECFDF5; color: #047857; border-color: #A7F3D0; }
    .verify-pill.search { background: var(--bg-subtle); color: var(--text-muted); }
    .paper-takeaway {
      font-size: 14px;
      color: var(--text-secondary);
      margin: 0 0 8px;
      line-height: 1.65;
    }
    .paper-link { font-size: 13px; font-weight: 500; }

    /* Continuous Article Reader Mode */
    .reader-view {
      max-width: 1240px;
      margin: 22px auto 40px;
      padding: 0 28px;
      display: none;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }
    .reader-view.active { display: grid; }
    @media (max-width: 960px) {
      .reader-view { grid-template-columns: 1fr; padding: 0 16px; }
      .reader-toc { position: static !important; max-height: none !important; }
    }
    .reader-toc {
      position: sticky;
      top: 18px;
      max-height: calc(100vh - 36px);
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 14px;
      box-shadow: var(--shadow-sm);
    }
    .reader-toc-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin: 0 0 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .toc-link {
      display: flex;
      align-items: baseline;
      gap: 7px;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.45;
      margin-bottom: 2px;
    }
    .toc-link:hover { background: var(--bg-subtle); color: var(--accent); text-decoration: none; }
    .toc-stage { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); flex-shrink: 0; }

    .reader-article {
      min-width: 0;
      max-width: 820px;
    }
    .reader-figure-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 22px;
      text-align: center;
    }
    .reader-figure-card img {
      max-width: 100%;
      max-height: 460px;
      object-fit: contain;
      border-radius: 6px;
      background: #FFFFFF;
      cursor: zoom-in;
    }
    .reader-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }
    .reader-card-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .reader-card h2 {
      font-family: var(--font-serif);
      font-size: 22px;
      margin: 0 0 6px;
      line-height: 1.32;
    }

    /* Below-the-fold Academic Appendix */
    .appendix {
      max-width: 1560px;
      margin: 24px auto 64px;
      padding: 0 28px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (max-width: 1180px) {
      .appendix { padding: 0 16px; }
    }
    .appendix-card {
      min-width: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 26px;
      box-shadow: var(--shadow-sm);
    }
    .appendix-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .two-col {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
      gap: 20px;
    }
    @media (max-width: 960px) {
      .two-col { grid-template-columns: 1fr; }
    }

    table.trace-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    table.trace-table th,
    table.trace-table td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      line-height: 1.55;
    }
    table.trace-table th {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      background: var(--bg-paper);
      font-weight: 600;
    }
    table.trace-table tr:hover td { background: var(--bg-subtle); cursor: pointer; }
    .trace-node-link {
      border: 0; background: transparent; cursor: pointer; padding: 0; font: inherit; text-align: left;
      font-weight: 600;
      color: var(--accent);
      display: inline-block;
    }
    .trace-node-link:hover { text-decoration: underline; }
    .mono { font-family: var(--font-mono); font-size: 12.5px; }

    .glossary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
    }
    .glossary-item {
      border: 1px solid var(--border);
      background: var(--bg-paper);
      border-radius: 7px;
      padding: 9px 12px;
      display: flex;
      gap: 10px;
      align-items: baseline;
    }
    .glossary-sym {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--accent);
      font-size: 13.5px;
      min-width: 42px;
      flex-shrink: 0;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 95vw;
      max-height: 92vh;
      background: #FFFFFF;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    /* Print friendliness */
    @media print {
      .toolbar, .module-rail-wrap, .canvas-controls, .stepper, .tabs, .reader-toc { display: none !important; }
      .workspace { display: none !important; }
      .reader-view { display: block !important; }
      .reader-article { max-width: 100%; }
    }
    .graph-label { height:100%; display:flex; align-items:center; white-space:nowrap; font-family:var(--font-sans); }
    .graph-label > span { display:inline-block; flex:none; transform-origin:left center; }
    .graph-label.center > span { transform-origin:center; }
    .graph-label .katex { font-size:1em; }
    .graph-label .katex-display { display:inline-block; margin:0; }
    .math-error { color:var(--crimson); }
    .step-select summary { cursor:pointer; }
    #stepSelect { display:grid; gap:4px; margin-top:6px; }
    #stepSelect button { text-align:left; }
    #stepSelect [aria-current="step"] { font-weight:700; }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="kicker-row" id="kickerRow"></div>
      <h1 class="title" id="pageTitle"></h1>
      <p class="subtitle" id="pageSubtitle"></p>
      <div class="source-paper-bar" id="sourcePaper" hidden></div>
      <div class="core-insight" id="coreInsight"></div>
      <div class="toolbar">
        <div class="tag-list" id="tagList"></div>
        <div class="btn-group">
          <div class="segmented" role="tablist" aria-label="阅读模式">
            <button class="btn active" id="btnModeExplore" onclick="setPageMode('explore')">图解分栏</button>
            <button class="btn" id="btnModeReader" onclick="setPageMode('reader')">连续精读</button>
          </div>
          <div class="segmented" id="viewModeGroup">
            <button class="btn active" id="btnViewGraph" onclick="setViewMode('graph')">交互图</button>
            <button class="btn" id="btnViewSplit" onclick="setViewMode('split')">双屏对照</button>
            <button class="btn" id="btnViewImage" onclick="setViewMode('image')">原图</button>
          </div>
          <button class="btn primary" id="btnToggleWalkthrough" onclick="toggleWalkthrough()">▶ 单步演进</button>
          <button class="btn" id="btnTheme" onclick="toggleTheme()" title="切换浅色/暗色主题">🌙 暗色</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Quick Module Navigation Strip -->
  <nav class="module-rail-wrap" id="moduleRailWrap" aria-label="模块快速跳转">
    <div class="module-rail" id="moduleRail"></div>
  </nav>

  <!-- Explore Mode: Interactive Graph + Unified Inspector -->
  <main class="workspace" id="exploreWorkspace">
    <section class="panel">
      <div class="canvas-header">
        <div class="canvas-title">
          <span>模型计算图</span>
          <span class="zoom-badge" id="zoomBadge">100%</span>
        </div>
        <div class="canvas-controls" id="graphControls">
          <button class="btn btn-sm" onclick="focusSelectedNode()">聚焦当前</button>
          <button class="btn btn-sm" onclick="resetCamera()">适配全局</button>
          <button class="btn btn-sm" onclick="toggleEdgeLabels()" id="btnEdgeLabels">全部边标签</button>
          <button class="btn btn-sm" onclick="toggleLayout()" id="btnLayout">切换竖排</button>
          <button class="btn btn-sm" onclick="zoomCanvas(1.2)" aria-label="放大">＋</button>
          <button class="btn btn-sm" onclick="zoomCanvas(0.82)" aria-label="缩小">－</button>
        </div>
      </div>

      <div class="canvas-stage" id="canvasStage">
        <div class="svg-viewport" id="svgViewport">
          <svg id="archSvg" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div class="orig-image-pane" id="origImagePane" style="display:none;">
          <span class="orig-caption">原始架构图（点击放大）</span>
          <img id="origImageEl" alt="Original Architecture Diagram" onclick="openLightbox()" />
        </div>
      </div>

      <div class="legend-bar">
        <div class="legend-items">
          <span class="legend-item"><span class="legend-line"></span>主干流</span>
          <span class="legend-item"><span class="legend-line residual"></span>残差 / 跳跃</span>
          <span class="legend-item"><span class="legend-line conditioning"></span>条件注入</span>
          <span class="legend-item"><span class="legend-line loss"></span>损失 / 监督</span>
        </div>
        <div id="walkthroughStatus">探索模式 · 滚轮缩放 / 拖拽画布</div>
      </div>

      <div class="stepper" id="stepperBox">
        <div class="stepper-collapsed" id="stepperCollapsed">
          <span>点击 <strong>「单步演进」</strong> 沿计算路径逐步高亮张量流向（支持方向键 ← / →）。</span>
          <button class="btn btn-sm" onclick="toggleWalkthrough()">开启演进</button>
        </div>
        <div class="stepper-expanded" id="stepperExpanded" style="display:none;">
          <div class="stepper-top">
            <div class="step-meta">
              <span class="step-badge" id="stepBadge">Step 1 / 1</span>
              <span class="step-title" id="stepTitle"></span>
            </div>
            <div class="btn-group">
              <button class="btn btn-sm" id="btnPrevStep" onclick="goStep(state.stepIndex - 1)">◀ 上一步</button>
              <button class="btn btn-sm" id="btnNextStep" onclick="goStep(state.stepIndex + 1)">下一步 ▶</button>
            </div>
          </div>
          <p class="step-narration" id="stepNarration"></p>
          <div class="step-bar">
            <details class="step-select" id="stepMenu"><summary>选择步骤</summary><div id="stepSelect"></div></details>
            <div class="step-progress"><div class="step-progress-fill" id="stepProgressFill"></div></div>
          </div>
        </div>
      </div>
    </section>

    <aside class="panel inspector">
      <div class="inspector-head">
        <div class="inspector-top-row">
          <div id="inspectorCategory"></div>
          <div class="btn-group">
            <button class="btn btn-sm" id="btnPrevNode" onclick="stepNode(-1)">← 上一模块</button>
            <button class="btn btn-sm" id="btnNextNode" onclick="stepNode(1)">下一模块 →</button>
          </div>
        </div>
        <h2 class="inspector-title" id="inspectorTitle"></h2>
        <p class="inspector-role" id="inspectorRole"></p>
        <div class="io-strip" id="inspectorIO"></div>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="all" onclick="setTab('all')">完整精读</button>
        <button class="tab-btn" data-tab="mechanics" onclick="setTab('mechanics')">原理与公式</button>
        <button class="tab-btn" data-tab="rationale" onclick="setTab('rationale')">设计动机</button>
        <button class="tab-btn" data-tab="knowledge" onclick="setTab('knowledge')">知识与论文</button>
      </div>
      <div class="inspector-body" id="inspectorBody"></div>
    </aside>
  </main>

  <!-- Continuous Article Reader Mode -->
  <section class="reader-view" id="readerView">
    <aside class="reader-toc">
      <h3 class="reader-toc-title">精读目录</h3>
      <div id="readerTocList"></div>
    </aside>
    <article class="reader-article" id="readerArticle"></article>
  </section>

  <!-- Below-the-fold Academic Appendix -->
  <section class="appendix" id="appendixSection">
    <div class="appendix-card" id="overviewCard">
      <h3 class="appendix-title">架构总览与端到端张量追踪</h3>
      <p class="prose" id="overviewSummary" style="margin-bottom: 16px;"></p>
      <div style="overflow-x:auto;">
        <table class="trace-table">
          <thead>
            <tr>
              <th style="width:62px;">阶段</th>
              <th style="width:220px;">模块</th>
              <th style="width:210px;">输入形态</th>
              <th style="width:210px;">输出形态</th>
              <th>核心变换职责</th>
            </tr>
          </thead>
          <tbody id="traceTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="two-col">
      <div class="appendix-card">
        <h3 class="appendix-title">关联论文谱系汇总</h3>
        <div id="bibList"></div>
      </div>
      <div class="appendix-card">
        <h3 class="appendix-title">符号与维度词典</h3>
        <div class="glossary-grid" id="glossaryGrid"></div>
        <div id="uncertaintyWrap" style="margin-top:20px; display:none;">
          <h4 class="section-label">图面推断与不确定性说明</h4>
          <div class="callout warn" id="uncertaintyList"></div>
        </div>
      </div>
    </div>
  </section>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" alt="Enlarged Architecture Diagram" />
  </div>

  <script>
    const ARCH_DATA = /*__ARCH_DATA_PLACEHOLDER__*/null;
    const IMAGE_DATA_URI = /*__IMAGE_URI_PLACEHOLDER__*/"";

    const CATEGORY_STYLE_LIGHT = {
      input:      { label: "输入表征",   fill: "#F1F5F9", stroke: "#475569", text: "#0F172A" },
      encoder:    { label: "编码 / 主干", fill: "#EEF2FF", stroke: "#3730A3", text: "#1E1B4B" },
      attention:  { label: "注意力 / 融合", fill: "#FEF3C7", stroke: "#B45309", text: "#78350F" },
      projection: { label: "投影 / 归一化", fill: "#F0FDFA", stroke: "#0F766E", text: "#134E4A" },
      decoder:    { label: "解码 / 生成", fill: "#F5F3FF", stroke: "#6D28D9", text: "#3B0764" },
      loss:       { label: "损失 / 监督", fill: "#FEF2F2", stroke: "#B91C1C", text: "#7F1D1D" },
      output:     { label: "最终输出",   fill: "#ECFDF5", stroke: "#047857", text: "#064E3B" }
    };

    const CATEGORY_STYLE_DARK = {
      input:      { label: "输入表征",   fill: "#1E2530", stroke: "#94A3B8", text: "#F1F5F9" },
      encoder:    { label: "编码 / 主干", fill: "#1E2340", stroke: "#818CF8", text: "#E0E7FF" },
      attention:  { label: "注意力 / 融合", fill: "#2E2517", stroke: "#F59E0B", text: "#FEF3C7" },
      projection: { label: "投影 / 归一化", fill: "#152C2B", stroke: "#2DD4BF", text: "#CCFBF1" },
      decoder:    { label: "解码 / 生成", fill: "#281D3D", stroke: "#A78BFA", text: "#EDE9FE" },
      loss:       { label: "损失 / 监督", fill: "#331B1E", stroke: "#F87171", text: "#FEE2E2" },
      output:     { label: "最终输出",   fill: "#152C23", stroke: "#34D399", text: "#D1FAE5" }
    };

    const GROUP_COLORS = {
      blue:   { fill: "rgba(59, 130, 246, 0.06)", stroke: "rgba(37, 99, 235, 0.28)", text: "#1D4ED8" },
      purple: { fill: "rgba(139, 92, 246, 0.06)", stroke: "rgba(124, 58, 237, 0.28)", text: "#6D28D9" },
      green:  { fill: "rgba(16, 185, 129, 0.06)", stroke: "rgba(5, 150, 105, 0.28)", text: "#047857" },
      amber:  { fill: "rgba(245, 158, 11, 0.07)", stroke: "rgba(217, 119, 6, 0.30)", text: "#B45309" },
      slate:  { fill: "rgba(100, 116, 139, 0.06)", stroke: "rgba(71, 85, 105, 0.26)", text: "#334155" }
    };

    const EDGE_STYLE = {
      main:         { stroke: "#475569", darkStroke: "#94A3B8", dash: "",    marker: "arrow-main" },
      residual:     { stroke: "#4F46E5", darkStroke: "#818CF8", dash: "6 4", marker: "arrow-residual" },
      conditioning: { stroke: "#B45309", darkStroke: "#F59E0B", dash: "2 4", marker: "arrow-cond" },
      loss:         { stroke: "#B91C1C", darkStroke: "#F87171", dash: "5 3", marker: "arrow-loss" }
    };

    const RELATION_LABEL = {
      foundational:       { text: "奠基工作", cls: "rel-foundational" },
      direct_predecessor: { text: "直接前作", cls: "rel-direct_predecessor" },
      alternative:        { text: "同类方案", cls: "rel-alternative" },
      follow_up:          { text: "后续演进", cls: "rel-follow_up" }
    };

    const state = {
      selectedNodeId: null,
      activeTab: "all",
      pageMode: "explore",
      viewMode: "graph",
      layout: (ARCH_DATA && ARCH_DATA.meta && ARCH_DATA.meta.default_layout) || "horizontal",
      walkthrough: false,
      stepIndex: 0,
      showAllEdgeLabels: !ARCH_DATA || (ARCH_DATA.edges || []).length <= 10,
      theme: "light",
      cam: { x: 0, y: 0, scale: 1 },
      graphBounds: { minX: 0, minY: 0, w: 1000, h: 500 },
      lastPositions: new Map(),
      sortedNodes: [],
      nodeMap: new Map()
    };

    function getCategoryStyle(cat) {
      const palette = state.theme === "dark" ? CATEGORY_STYLE_DARK : CATEGORY_STYLE_LIGHT;
      return palette[cat] || palette.encoder;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    const mathRenderer = createMathRenderer(katex);
    function formatMath(value, mode) {
      try {
        return mathRenderer.format(value, mode);
      } catch (error) {
        return '<code class="math-error" title="' + escapeHtml(error.message) + '">' + escapeHtml(value) + '</code>';
      }
    }
    const renderInlineMath = value => formatMath(value, "text");
    const renderSymbol = value => formatMath(value, "symbol");
    const renderDisplayMath = value => '<div class="formula-box">' + formatMath(value, "display") + '</div>';

    // SVG text cannot contain mathematical layout. Use an HTML label inside
    // the diagram so fractions, scripts and MathML survive camera transforms.
    function graphLabel(html, x, y, width, height, color, size, center = false) {
      return `<foreignObject x="${x}" y="${y}" width="${width}" height="${height}" pointer-events="none">
        <div xmlns="http://www.w3.org/1999/xhtml" class="graph-label ${center ? "center" : ""}" style="color:${color};font-size:${size}px;justify-content:${center ? "center" : "flex-start"}"><span>${html}</span></div>
      </foreignObject>`;
    }

    function init() {
      if (!ARCH_DATA) {
        document.body.innerHTML = "<p style='padding:40px;'>未检测到注入的架构数据。</p>";
        return;
      }
      state.sortedNodes = [...ARCH_DATA.nodes].sort(
        (a, b) => (a.stage - b.stage) || ((a.lane || 0) - (b.lane || 0))
      );
      ARCH_DATA.nodes.forEach((n) => state.nodeMap.set(n.id, n));

      // Header
      const m = ARCH_DATA.meta || {};
      if (m.source_paper) {
        const source = document.getElementById("sourcePaper");
        source.innerHTML = "原文依据 · " + renderInlineMath(m.source_paper.title) + " · " + renderInlineMath(m.source_paper.figure);
        source.hidden = false;
      }
      const kickerParts = [];
      if (m.domain) kickerParts.push(`<span class="kicker-badge">${renderInlineMath(m.domain)}</span>`);
      if (m.venue_year) kickerParts.push(`<span>${renderInlineMath(m.venue_year)}</span>`);
      kickerParts.push(`<span>${ARCH_DATA.nodes.length} 个核心模块 · ${ARCH_DATA.steps.length} 步演进流程</span>`);
      document.getElementById("kickerRow").innerHTML = kickerParts.join(" · ");
      document.getElementById("pageTitle").innerHTML = renderInlineMath(m.title || "ML Architecture Guide");
      document.getElementById("pageSubtitle").innerHTML = renderInlineMath(m.subtitle || "");
      document.getElementById("coreInsight").innerHTML =
        `<strong>核心洞见</strong>${renderInlineMath(m.core_insight || "")}`;
      document.getElementById("tagList").innerHTML = (m.tags || [])
        .map((t) => `<span class="tag"># ${renderInlineMath(t)}</span>`)
        .join("");

      // Image availability
      if (IMAGE_DATA_URI) {
        document.getElementById("origImageEl").src = IMAGE_DATA_URI;
        document.getElementById("lightboxImg").src = IMAGE_DATA_URI;
      } else {
        document.getElementById("btnViewSplit").style.display = "none";
        document.getElementById("btnViewImage").style.display = "none";
      }

      const firstStep = (ARCH_DATA.steps || [])[0];
      state.selectedNodeId =
        (firstStep && firstStep.focus_node) ||
        (state.sortedNodes[0] && state.sortedNodes[0].id);

      document.getElementById("btnEdgeLabels").classList.toggle("active", state.showAllEdgeLabels);

      document.addEventListener("click", (event) => {
        const item = event.target.closest("[data-node]");
        if (!item) return;
        const nid = item.dataset.node;
        const fromTable = Boolean(item.closest("table"));
        const locateInGraph = fromTable || item.dataset.locate === "true";
        if (locateInGraph) {
          if (state.pageMode === "reader") setPageMode("explore");
          if (state.viewMode === "image") setViewMode("graph");
        }
        selectNode(nid, locateInGraph || Boolean(item.closest(".module-rail")));
        if (locateInGraph) {
          document.getElementById("exploreWorkspace").scrollIntoView({ behavior: "smooth" });
        }
      });

      document.getElementById("archSvg").addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const item = event.target.closest("[data-node]");
        if (!item) return;
        event.preventDefault();
        selectNode(item.dataset.node, false);
        const sel = document.querySelector("#archSvg .arch-node.selected");
        if (sel) sel.focus();
      });

      const stepMenu = document.getElementById("stepMenu");
      stepMenu.addEventListener("click", event => {
        const choice = event.target.closest("[data-step]");
        if (!choice) return;
        stepMenu.open = false;
        goStep(Number(choice.dataset.step));
        stepMenu.querySelector("summary").focus();
      });
      setupPanZoom();
      renderModuleRail();
      renderGraph();
      initSmartCamera();
      document.fonts.ready.then(fitGraphLabels);
      renderStepper();
      renderInspector();
      renderReaderView();
      renderAppendix();
    }

    function renderModuleRail() {
      const rail = document.getElementById("moduleRail");
      const chips = state.sortedNodes.map((n) => `
        <button class="rail-chip ${n.id === state.selectedNodeId ? "active" : ""}" data-node="${escapeHtml(n.id)}">
          <span class="rail-stage">S${n.stage}</span>
          <span>${renderInlineMath(n.short_name || n.name)}</span>
        </button>
      `).join("");
      rail.innerHTML = `<span class="rail-label">模块导航</span>${chips}`;
    }

    /* ---------------- Collision-Free Graph Layout & Routing ---------------- */
    function computePositions() {
      const horiz = state.layout === "horizontal";
      const nodeW = horiz ? 196 : 228;
      const nodeH = horiz ? 78 : 70;
      const gapX = horiz ? 92 : 60;
      const gapY = horiz ? 42 : 84;
      const pad = 72;

      const groups = new Map();
      ARCH_DATA.nodes.forEach((n, idx) => {
        const s = typeof n.stage === "number" ? n.stage : idx;
        if (!groups.has(s)) groups.set(s, []);
        groups.get(s).push(n);
      });

      const stages = Array.from(groups.keys()).sort((a, b) => a - b);
      let maxPerStage = 1;
      stages.forEach((s) => {
        groups.get(s).sort((a, b) => (a.lane || 0) - (b.lane || 0));
        maxPerStage = Math.max(maxPerStage, groups.get(s).length);
      });

      const pos = new Map();
      const maxSpanY = maxPerStage * nodeH + (maxPerStage - 1) * gapY;
      const maxSpanX = maxPerStage * nodeW + (maxPerStage - 1) * gapX;

      stages.forEach((s, sIdx) => {
        const list = groups.get(s);
        if (horiz) {
          const colH = list.length * nodeH + (list.length - 1) * gapY;
          const startY = pad + (maxSpanY - colH) / 2;
          const x = pad + sIdx * (nodeW + gapX);
          list.forEach((n, lIdx) => {
            pos.set(n.id, {
              x,
              y: startY + lIdx * (nodeH + gapY),
              w: nodeW,
              h: nodeH,
              stageIdx: sIdx,
              laneIdx: lIdx,
              laneCount: list.length
            });
          });
        } else {
          const rowW = list.length * nodeW + (list.length - 1) * gapX;
          const startX = pad + (maxSpanX - rowW) / 2;
          const y = pad + sIdx * (nodeH + gapY);
          list.forEach((n, lIdx) => {
            pos.set(n.id, {
              x: startX + lIdx * (nodeW + gapX),
              y,
              w: nodeW,
              h: nodeH,
              stageIdx: sIdx,
              laneIdx: lIdx,
              laneCount: list.length
            });
          });
        }
      });

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      pos.forEach((p) => {
        minX = Math.min(minX, p.x);
        minY = Math.min(minY, p.y);
        maxX = Math.max(maxX, p.x + p.w);
        maxY = Math.max(maxY, p.y + p.h);
      });

      const coreBounds = {
        minX: isFinite(minX) ? minX : pad,
        minY: isFinite(minY) ? minY : pad,
        maxX: isFinite(maxX) ? maxX : 600,
        maxY: isFinite(maxY) ? maxY : 360
      };

      state.lastPositions = pos;
      return { pos, coreBounds };
    }

    function cubicPoint(p0, p1, p2, p3, t) {
      const mt = 1 - t;
      return {
        x: mt*mt*mt*p0.x + 3*mt*mt*t*p1.x + 3*mt*t*t*p2.x + t*t*t*p3.x,
        y: mt*mt*mt*p0.y + 3*mt*mt*t*p1.y + 3*mt*t*t*p2.y + t*t*t*p3.y
      };
    }

    function computeEdgeGeometries(pos, coreBounds, horiz) {
      const edges = ARCH_DATA.edges || [];
      const pairSet = new Set(edges.map((e) => `${e.source}->${e.target}`));

      // Count outer channels for skip & feedback edges to stagger them without collision
      let topChannel = 0;
      let bottomChannel = 0;
      let feedbackChannel = 0;

      // Track outgoing/incoming fan counts for stageDiff === 1 port staggering
      const outMap = new Map();
      const inMap = new Map();
      edges.forEach((e, i) => {
        const sp = pos.get(e.source);
        const tp = pos.get(e.target);
        if (!sp || !tp) return;
        if (tp.stageIdx - sp.stageIdx === 1) {
          if (!outMap.has(e.source)) outMap.set(e.source, []);
          if (!inMap.has(e.target)) inMap.set(e.target, []);
          outMap.get(e.source).push(i);
          inMap.get(e.target).push(i);
        }
      });

      let extMinX = coreBounds.minX;
      let extMinY = coreBounds.minY;
      let extMaxX = coreBounds.maxX;
      let extMaxY = coreBounds.maxY;

      const geoms = edges.map((edge, idx) => {
        const sp = pos.get(edge.source);
        const tp = pos.get(edge.target);
        if (!sp || !tp) return null;

        const stageDiff = tp.stageIdx - sp.stageIdx;
        const hasReverse = pairSet.has(`${edge.target}->${edge.source}`);
        let d = "";
        let mid = { x: 0, y: 0 };

        if (horiz) {
          if (stageDiff === 1) {
            const outs = outMap.get(edge.source) || [idx];
            const ins = inMap.get(edge.target) || [idx];
            const outSlot = outs.indexOf(idx);
            const inSlot = ins.indexOf(idx);
            const outOffset = outs.length > 1 ? ((outSlot / (outs.length - 1)) - 0.5) * (sp.h * 0.54) : 0;
            const inOffset = ins.length > 1 ? ((inSlot / (ins.length - 1)) - 0.5) * (tp.h * 0.54) : 0;
            const p0 = { x: sp.x + sp.w, y: sp.y + sp.h / 2 + outOffset };
            const p3 = { x: tp.x, y: tp.y + tp.h / 2 + inOffset };
            const dx = Math.max(30, (p3.x - p0.x) * 0.48);
            const p1 = { x: p0.x + dx, y: p0.y };
            const p2 = { x: p3.x - dx, y: p3.y };
            d = `M ${p0.x} ${p0.y} C ${p1.x} ${p1.y}, ${p2.x} ${p2.y}, ${p3.x} ${p3.y}`;
            mid = cubicPoint(p0, p1, p2, p3, 0.5);
          } else if (stageDiff === 0) {
            const goingDown = tp.y > sp.y;
            const sideShift = hasReverse ? (goingDown ? -24 : 24) : 0;
            const p0 = { x: sp.x + sp.w / 2 + sideShift * 0.55, y: goingDown ? sp.y + sp.h : sp.y };
            const p3 = { x: tp.x + tp.w / 2 + sideShift * 0.55, y: goingDown ? tp.y : tp.y + tp.h };
            const midY = (p0.y + p3.y) / 2;
            const p1 = { x: p0.x + sideShift, y: midY };
            const p2 = { x: p3.x + sideShift, y: midY };
            d = `M ${p0.x} ${p0.y} C ${p1.x} ${p1.y}, ${p2.x} ${p2.y}, ${p3.x} ${p3.y}`;
            mid = cubicPoint(p0, p1, p2, p3, 0.5);
          } else if (stageDiff > 1) {
            // Route cleanly outside top or bottom of graph to avoid crossing intermediate nodes
            const archAbove = edge.type !== "loss" && sp.laneIdx === 0;
            let channelY;
            if (archAbove) {
              channelY = coreBounds.minY - 34 - topChannel * 24;
              topChannel += 1;
              extMinY = Math.min(extMinY, channelY - 18);
            } else {
              channelY = coreBounds.maxY + 34 + bottomChannel * 24;
              bottomChannel += 1;
              extMaxY = Math.max(extMaxY, channelY + 18);
            }
            const x0 = sp.x + sp.w * 0.65;
            const y0 = archAbove ? sp.y : sp.y + sp.h;
            const x3 = tp.x + tp.w * 0.35;
            const y3 = archAbove ? tp.y : tp.y + tp.h;
            const r = 14;
            const dirY = archAbove ? -1 : 1;
            d = `M ${x0} ${y0} L ${x0} ${channelY - dirY * r} Q ${x0} ${channelY} ${x0 + r} ${channelY} L ${x3 - r} ${channelY} Q ${x3} ${channelY} ${x3} ${channelY - dirY * r} L ${x3} ${y3}`;
            mid = { x: (x0 + x3) / 2, y: channelY };
          } else {
            // Feedback / loop edge (stageDiff < 0): route cleanly along bottom outer channels
            const channelY = coreBounds.maxY + 42 + (bottomChannel + feedbackChannel) * 24;
            feedbackChannel += 1;
            extMaxY = Math.max(extMaxY, channelY + 20);
            const x0 = sp.x + sp.w * (0.35 + ((feedbackChannel % 3) * 0.14));
            const y0 = sp.y + sp.h;
            const x3 = tp.x + tp.w * 0.5;
            const y3 = tp.y + tp.h;
            const r = 14;
            d = `M ${x0} ${y0} L ${x0} ${channelY - r} Q ${x0} ${channelY} ${x0 - r} ${channelY} L ${x3 + r} ${channelY} Q ${x3} ${channelY} ${x3} ${channelY - r} L ${x3} ${y3}`;
            // Place label slightly staggered along horizontal trunk
            const tPos = 0.32 + ((feedbackChannel % 4) * 0.14);
            mid = { x: x3 + (x0 - x3) * tPos, y: channelY };
          }
        } else {
          // Vertical layout
          if (stageDiff === 1) {
            const outs = outMap.get(edge.source) || [idx];
            const ins = inMap.get(edge.target) || [idx];
            const outSlot = outs.indexOf(idx);
            const inSlot = ins.indexOf(idx);
            const outOffset = outs.length > 1 ? ((outSlot / (outs.length - 1)) - 0.5) * (sp.w * 0.54) : 0;
            const inOffset = ins.length > 1 ? ((inSlot / (ins.length - 1)) - 0.5) * (tp.w * 0.54) : 0;
            const p0 = { x: sp.x + sp.w / 2 + outOffset, y: sp.y + sp.h };
            const p3 = { x: tp.x + tp.w / 2 + inOffset, y: tp.y };
            const dy = Math.max(26, (p3.y - p0.y) * 0.48);
            const p1 = { x: p0.x, y: p0.y + dy };
            const p2 = { x: p3.x, y: p3.y - dy };
            d = `M ${p0.x} ${p0.y} C ${p1.x} ${p1.y}, ${p2.x} ${p2.y}, ${p3.x} ${p3.y}`;
            mid = cubicPoint(p0, p1, p2, p3, 0.5);
          } else if (stageDiff === 0) {
            const goingRight = tp.x > sp.x;
            const sideShift = hasReverse ? (goingRight ? -20 : 20) : 0;
            const p0 = { x: goingRight ? sp.x + sp.w : sp.x, y: sp.y + sp.h / 2 + sideShift * 0.55 };
            const p3 = { x: goingRight ? tp.x : tp.x + tp.w, y: tp.y + tp.h / 2 + sideShift * 0.55 };
            const midX = (p0.x + p3.x) / 2;
            const p1 = { x: midX, y: p0.y + sideShift };
            const p2 = { x: midX, y: p3.y + sideShift };
            d = `M ${p0.x} ${p0.y} C ${p1.x} ${p1.y}, ${p2.x} ${p2.y}, ${p3.x} ${p3.y}`;
            mid = cubicPoint(p0, p1, p2, p3, 0.5);
          } else if (stageDiff > 1) {
            const archRight = edge.type !== "loss" && sp.laneIdx >= tp.laneIdx;
            let channelX;
            if (archRight) {
              channelX = coreBounds.maxX + 38 + topChannel * 26;
              topChannel += 1;
              extMaxX = Math.max(extMaxX, channelX + 24);
            } else {
              channelX = coreBounds.minX - 38 - bottomChannel * 26;
              bottomChannel += 1;
              extMinX = Math.min(extMinX, channelX - 24);
            }
            const x0 = archRight ? sp.x + sp.w : sp.x;
            const y0 = sp.y + sp.h * 0.6;
            const x3 = archRight ? tp.x + tp.w : tp.x;
            const y3 = tp.y + tp.h * 0.4;
            const r = 14;
            const dirX = archRight ? 1 : -1;
            d = `M ${x0} ${y0} L ${channelX - dirX * r} ${y0} Q ${channelX} ${y0} ${channelX} ${y0 + r} L ${channelX} ${y3 - r} Q ${channelX} ${y3} ${channelX - dirX * r} ${y3} L ${x3} ${y3}`;
            mid = { x: channelX, y: (y0 + y3) / 2 };
          } else {
            const channelX = coreBounds.maxX + 44 + (topChannel + feedbackChannel) * 26;
            feedbackChannel += 1;
            extMaxX = Math.max(extMaxX, channelX + 24);
            const x0 = sp.x + sp.w;
            const y0 = sp.y + sp.h * 0.5;
            const x3 = tp.x + tp.w;
            const y3 = tp.y + tp.h * 0.5;
            const r = 14;
            d = `M ${x0} ${y0} L ${channelX - r} ${y0} Q ${channelX} ${y0} ${channelX} ${y0 - r} L ${channelX} ${y3 + r} Q ${channelX} ${y3} ${channelX - r} ${y3} L ${x3} ${y3}`;
            const tPos = 0.32 + ((feedbackChannel % 4) * 0.14);
            mid = { x: channelX, y: y3 + (y0 - y3) * tPos };
          }
        }
        return { d, mid };
      });

      const padOuter = 44;
      state.graphBounds = {
        minX: extMinX - padOuter,
        minY: extMinY - padOuter,
        w: Math.max(600, (extMaxX - extMinX) + padOuter * 2),
        h: Math.max(360, (extMaxY - extMinY) + padOuter * 2)
      };

      return geoms;
    }

    function getActiveSets() {
      if (!state.walkthrough) {
        return { activeNodes: null, activeEdges: null };
      }
      const step = ARCH_DATA.steps[state.stepIndex];
      if (!step) return { activeNodes: null, activeEdges: null };
      const activeNodes = new Set(step.active_nodes || []);
      const activeEdges = new Set(step.active_edges || []);
      if (!Array.isArray(step.active_edges)) {
        ARCH_DATA.edges.forEach((e) => {
          if (activeNodes.has(e.source) && activeNodes.has(e.target)) {
            activeEdges.add(e.id);
          }
        });
      }
      return { activeNodes, activeEdges };
    }

    function renderGraph() {
      const svg = document.getElementById("archSvg");
      const { pos, coreBounds } = computePositions();
      const horiz = state.layout === "horizontal";
      const edgeGeoms = computeEdgeGeometries(pos, coreBounds, horiz);
      const { activeNodes, activeEdges } = getActiveSets();
      const isDark = state.theme === "dark";

      document.getElementById("btnLayout").textContent = horiz ? "切换竖排" : "切换横排";

      const arrowMain = isDark ? "#94A3B8" : "#475569";
      const arrowRes = isDark ? "#818CF8" : "#4F46E5";
      const arrowCond = isDark ? "#F59E0B" : "#B45309";
      const arrowLoss = isDark ? "#F87171" : "#B91C1C";

      const defs = `
        <defs>
          <marker id="arrow-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="${arrowMain}" />
          </marker>
          <marker id="arrow-residual" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="${arrowRes}" />
          </marker>
          <marker id="arrow-cond" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="${arrowCond}" />
          </marker>
          <marker id="arrow-loss" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="${arrowLoss}" />
          </marker>
        </defs>
      `;

      // Optional logical phase groups
      let groupsSvg = "";
      (ARCH_DATA.groups || []).forEach((grp) => {
        const pts = (grp.node_ids || []).map((id) => pos.get(id)).filter(Boolean);
        if (!pts.length) return;
        const gx1 = Math.min(...pts.map((p) => p.x)) - 18;
        const gy1 = Math.min(...pts.map((p) => p.y)) - 30;
        const gx2 = Math.max(...pts.map((p) => p.x + p.w)) + 18;
        const gy2 = Math.max(...pts.map((p) => p.y + p.h)) + 18;
        const gc = GROUP_COLORS[grp.color] || GROUP_COLORS.slate;
        groupsSvg += `
          <g class="arch-group">
            <rect x="${gx1}" y="${gy1}" width="${gx2 - gx1}" height="${gy2 - gy1}" rx="14"
              fill="${gc.fill}" stroke="${gc.stroke}" stroke-width="1.3" stroke-dasharray="5 4" />
            ${graphLabel(renderInlineMath(grp.label), gx1 + 12, gy1, gx2 - gx1 - 18, 26, gc.text, 11.5)}
          </g>
        `;
      });

      // Edges
      let edgesSvg = "";
      (ARCH_DATA.edges || []).forEach((edge, idx) => {
        const geom = edgeGeoms[idx];
        if (!geom) return;
        const eid = edge.id || `edge_${idx}`;
        const est = EDGE_STYLE[edge.type] || EDGE_STYLE.main;
        const strokeColor = isDark ? est.darkStroke : est.stroke;
        const isActive = activeEdges && activeEdges.has(eid);
        const isDimmed = activeEdges && !isActive;
        const isConnectedToSelected =
          !state.walkthrough &&
          (edge.source === state.selectedNodeId || edge.target === state.selectedNodeId);

        const showPill = state.showAllEdgeLabels || isActive || isConnectedToSelected;
        const isMutedNonSelected = !state.walkthrough && !isConnectedToSelected && (ARCH_DATA.edges || []).length > 10;

        const cls = [
          "arch-edge",
          isDimmed ? "dimmed" : "",
          isMutedNonSelected ? "muted-edge" : "",
          !showPill ? "hide-pill" : "",
          isActive || isConnectedToSelected ? "active-flow" : ""
        ].filter(Boolean).join(" ");

        const pillText = edge.tensor_shape || edge.label || "";
        const displayPill = edge.tensor_shape ? renderSymbol(pillText) : renderInlineMath(pillText);
        const pillW = Math.min(138, Math.max(48, pillText.length * 8.2 + 16));

        edgesSvg += `
          <g class="${cls}"><title>${escapeHtml(edge.description || edge.label || "")}</title>
            <path class="edge-path" d="${geom.d}" fill="none" stroke="${strokeColor}"
              stroke-width="${isActive || isConnectedToSelected ? 2.4 : 1.6}"
              ${est.dash ? `stroke-dasharray="${est.dash}"` : ""}
              marker-end="url(#${est.marker})" />
            ${displayPill ? `
              <g class="edge-pill" transform="translate(${geom.mid.x}, ${geom.mid.y})">
                <rect x="${-pillW / 2}" y="-10.5" width="${pillW}" height="21" rx="10.5"
                  fill="var(--pill-bg)" stroke="${strokeColor}" stroke-opacity="0.55" stroke-width="1" />
                ${graphLabel(displayPill, -pillW / 2, -10.5, pillW, 21, "var(--pill-text)", 10.5, true)}
              </g>
            ` : ""}
          </g>
        `;
      });

      // Nodes
      let nodesSvg = "";
      ARCH_DATA.nodes.forEach((node) => {
        const p = pos.get(node.id);
        if (!p) return;
        const st = getCategoryStyle(node.category);
        const isSelected = node.id === state.selectedNodeId;
        const isDimmed = activeNodes && !activeNodes.has(node.id);
        const label = node.short_name || node.name;
        const outShape =
          node.io && node.io.outputs && node.io.outputs[0] && node.io.outputs[0].shape
            ? node.io.outputs[0].shape
            : "";

        nodesSvg += `
          <g class="arch-node ${isSelected ? "selected" : ""} ${isDimmed ? "dimmed" : ""}"
             transform="translate(${p.x}, ${p.y})"
             data-node="${escapeHtml(node.id)}" role="button" tabindex="0" aria-label="${escapeHtml(node.name)}">
            <rect class="node-box" width="${p.w}" height="${p.h}" rx="10"
              fill="${st.fill}" stroke="${st.stroke}" stroke-width="${isSelected ? 2.8 : 1.4}" />
            <rect x="0" y="0" width="6" height="${p.h}" rx="3" fill="${st.stroke}" />
            <text x="16" y="21" font-family="var(--font-sans)" font-size="10.8"
              font-weight="600" fill="${st.stroke}">${escapeHtml(st.label)} · S${node.stage}</text>
            ${node.repeat_badge ? `
              <rect x="${p.w - 44}" y="8" width="34" height="17" rx="8.5" fill="${st.stroke}" />
              ${graphLabel(renderInlineMath(node.repeat_badge), p.w - 44, 8, 34, 17, "#fff", 10, true)}
            ` : ""}
            ${graphLabel(renderInlineMath(label), 16, 24, p.w - 24, 25, st.text, 13.5)}
            ${outShape ? `
              ${graphLabel("→ " + renderSymbol(outShape), 16, 49, p.w - 24, 22, isDark ? "#94A3B8" : "#52525B", 10.8)}
            ` : ""}
          </g>
        `;
      });

      svg.innerHTML = `
        ${defs}
        <g id="cameraGroup" transform="translate(${state.cam.x}, ${state.cam.y}) scale(${state.cam.scale})">
          ${groupsSvg}
          ${edgesSvg}
          ${nodesSvg}
        </g>
      `;
      fitGraphLabels();
    }

    function fitGraphLabels() {
      for (const box of document.querySelectorAll("#archSvg .graph-label")) {
        const label = box.firstElementChild;
        if (!box.clientWidth || !label.offsetWidth) continue;
        const scale = Math.min(1, box.clientWidth / label.offsetWidth, box.clientHeight / label.offsetHeight);
        label.style.transform = "scale(" + scale + ")";
      }
    }

    function applyCamera() {
      const g = document.getElementById("cameraGroup");
      if (g) g.setAttribute("transform", `translate(${state.cam.x}, ${state.cam.y}) scale(${state.cam.scale})`);
      const badge = document.getElementById("zoomBadge");
      if (badge) badge.textContent = `${Math.round(state.cam.scale * 100)}%`;
    }

    function initSmartCamera() {
      const vp = document.getElementById("svgViewport");
      if (!vp) return;
      const vw = vp.clientWidth || 720;
      const vh = vp.clientHeight || 560;
      const sx = (vw - 24) / state.graphBounds.w;
      const sy = (vh - 24) / state.graphBounds.h;
      const fitScale = Math.min(1.08, Math.min(sx, sy));
      // If fitting the whole graph makes text unreadably tiny (< 58%), focus on the initial node at readable scale!
      if (fitScale < 0.58 && state.selectedNodeId) {
        focusNodeInCamera(state.selectedNodeId, 0.86);
      } else {
        resetCamera();
      }
    }

    function resetCamera() {
      const vp = document.getElementById("svgViewport");
      if (!vp) return;
      const vw = vp.clientWidth || 720;
      const vh = vp.clientHeight || 560;
      const sx = (vw - 24) / state.graphBounds.w;
      const sy = (vh - 24) / state.graphBounds.h;
      const scale = Math.min(1.08, Math.min(sx, sy));
      state.cam.scale = scale;
      state.cam.x = (vw - state.graphBounds.w * scale) / 2 - state.graphBounds.minX * scale;
      state.cam.y = (vh - state.graphBounds.h * scale) / 2 - state.graphBounds.minY * scale;
      applyCamera();
    }

    function focusNodeInCamera(nodeId, targetScale) {
      const vp = document.getElementById("svgViewport");
      const p = state.lastPositions.get(nodeId);
      if (!vp || !p) return;
      const vw = vp.clientWidth || 720;
      const vh = vp.clientHeight || 560;
      const scale = targetScale || Math.max(state.cam.scale, 0.86);
      const cx = p.x + p.w / 2;
      const cy = p.y + p.h / 2;
      state.cam.scale = Math.min(1.4, scale);
      state.cam.x = vw / 2 - cx * state.cam.scale;
      state.cam.y = vh / 2 - cy * state.cam.scale;
      applyCamera();
    }

    function focusSelectedNode() {
      if (state.selectedNodeId) focusNodeInCamera(state.selectedNodeId, 0.92);
    }

    function zoomCanvas(factor) {
      const vp = document.getElementById("svgViewport");
      const cx = (vp.clientWidth || 720) / 2;
      const cy = (vp.clientHeight || 560) / 2;
      const next = Math.min(2.4, Math.max(0.25, state.cam.scale * factor));
      const ratio = next / state.cam.scale;
      state.cam.x = cx - (cx - state.cam.x) * ratio;
      state.cam.y = cy - (cy - state.cam.y) * ratio;
      state.cam.scale = next;
      applyCamera();
    }

    function setupPanZoom() {
      const vp = document.getElementById("svgViewport");
      let dragging = false;
      let startX = 0, startY = 0;

      vp.addEventListener("mousedown", (e) => {
        if (e.target.closest(".arch-node")) return;
        dragging = true;
        startX = e.clientX - state.cam.x;
        startY = e.clientY - state.cam.y;
      });
      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        state.cam.x = e.clientX - startX;
        state.cam.y = e.clientY - startY;
        applyCamera();
      });
      window.addEventListener("mouseup", () => { dragging = false; });

      vp.addEventListener("wheel", (e) => {
        e.preventDefault();
        const rect = vp.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const factor = e.deltaY < 0 ? 1.1 : 0.91;
        const next = Math.min(2.4, Math.max(0.25, state.cam.scale * factor));
        const ratio = next / state.cam.scale;
        state.cam.x = mx - (mx - state.cam.x) * ratio;
        state.cam.y = my - (my - state.cam.y) * ratio;
        state.cam.scale = next;
        applyCamera();
      }, { passive: false });
    }

    /* ---------------- Interactions ---------------- */
    function selectNode(nodeId, autoCenter) {
      if (!state.nodeMap.has(nodeId)) return;
      state.selectedNodeId = nodeId;
      renderModuleRail();
      renderGraph();
      renderInspector();
      if (autoCenter) {
        focusNodeInCamera(nodeId, Math.max(state.cam.scale, 0.85));
      }
      const activeChip = document.querySelector(".rail-chip.active");
      if (activeChip) activeChip.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
    }

    function stepNode(delta) {
      const idx = state.sortedNodes.findIndex((n) => n.id === state.selectedNodeId);
      if (idx === -1) return;
      const next = Math.max(0, Math.min(state.sortedNodes.length - 1, idx + delta));
      selectNode(state.sortedNodes[next].id, true);
    }

    function setTab(tab) {
      state.activeTab = tab;
      document.querySelectorAll(".tab-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.tab === tab);
      });
      renderInspector();
    }

    function setPageMode(mode) {
      state.pageMode = mode;
      const isReader = mode === "reader";
      document.getElementById("btnModeExplore").classList.toggle("active", !isReader);
      document.getElementById("btnModeReader").classList.toggle("active", isReader);
      document.getElementById("exploreWorkspace").style.display = isReader ? "none" : "grid";
      document.getElementById("moduleRailWrap").style.display = isReader ? "none" : "block";
      document.getElementById("viewModeGroup").style.display = isReader ? "none" : "inline-flex";
      document.getElementById("btnToggleWalkthrough").style.display = isReader ? "none" : "inline-flex";
      document.getElementById("readerView").classList.toggle("active", isReader);
      if (!isReader) setTimeout(() => renderGraph(), 20);
    }

    function toggleTheme() {
      state.theme = state.theme === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", state.theme);
      document.getElementById("btnTheme").textContent = state.theme === "dark" ? "☀ 浅色" : "🌙 暗色";
      renderGraph();
      renderInspector();
      renderReaderView();
    }

    function toggleEdgeLabels() {
      state.showAllEdgeLabels = !state.showAllEdgeLabels;
      document.getElementById("btnEdgeLabels").classList.toggle("active", state.showAllEdgeLabels);
      renderGraph();
    }

    function toggleLayout() {
      state.layout = state.layout === "horizontal" ? "vertical" : "horizontal";
      renderGraph();
      initSmartCamera();
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      const ws = document.getElementById("exploreWorkspace");
      const stage = document.getElementById("canvasStage");
      const vp = document.getElementById("svgViewport");
      const imgPane = document.getElementById("origImagePane");
      const controls = document.getElementById("graphControls");

      document.getElementById("btnViewGraph").classList.toggle("active", mode === "graph");
      document.getElementById("btnViewSplit").classList.toggle("active", mode === "split");
      document.getElementById("btnViewImage").classList.toggle("active", mode === "image");

      stage.classList.toggle("split-mode", mode === "split");
      ws.classList.toggle("workspace-wide", mode === "split");

      if (mode === "graph") {
        vp.style.display = "block";
        imgPane.style.display = "none";
        controls.style.display = "flex";
        setTimeout(initSmartCamera, 20);
      } else if (mode === "image") {
        vp.style.display = "none";
        imgPane.style.display = "flex";
        controls.style.display = "none";
      } else {
        vp.style.display = "block";
        imgPane.style.display = "flex";
        controls.style.display = "flex";
        setTimeout(initSmartCamera, 20);
      }
    }

    function toggleWalkthrough() {
      state.walkthrough = !state.walkthrough;
      const btn = document.getElementById("btnToggleWalkthrough");
      btn.textContent = state.walkthrough ? "⏹ 退出演进" : "▶ 单步演进";
      document.getElementById("stepperCollapsed").style.display = state.walkthrough ? "none" : "flex";
      document.getElementById("stepperExpanded").style.display = state.walkthrough ? "block" : "none";
      document.getElementById("walkthroughStatus").textContent = state.walkthrough
        ? `单步演进 · Step ${state.stepIndex + 1}/${ARCH_DATA.steps.length}`
        : "探索模式 · 滚轮缩放 / 拖拽画布";
      if (state.walkthrough) {
        goStep(state.stepIndex);
      } else {
        renderGraph();
      }
    }

    function goStep(index) {
      const steps = ARCH_DATA.steps || [];
      if (!steps.length) return;
      state.stepIndex = Math.max(0, Math.min(steps.length - 1, index));
      if (!state.walkthrough) {
        state.walkthrough = true;
        document.getElementById("btnToggleWalkthrough").textContent = "⏹ 退出演进";
        document.getElementById("stepperCollapsed").style.display = "none";
        document.getElementById("stepperExpanded").style.display = "block";
      }
      const step = steps[state.stepIndex];
      if (step.focus_node && state.nodeMap.has(step.focus_node)) {
        state.selectedNodeId = step.focus_node;
      } else if (step.active_nodes && step.active_nodes[0]) {
        state.selectedNodeId = step.active_nodes[0];
      }
      document.getElementById("walkthroughStatus").textContent =
        `单步演进 · Step ${state.stepIndex + 1}/${steps.length}`;
      renderStepper();
      renderModuleRail();
      renderGraph();
      renderInspector();
      focusNodeInCamera(state.selectedNodeId, Math.max(state.cam.scale, 0.85));
    }

    function renderStepper() {
      const steps = ARCH_DATA.steps || [];
      if (!steps.length) {
        document.getElementById("stepperBox").style.display = "none";
        return;
      }
      const s = steps[state.stepIndex];
      const phaseTag = s.phase === "training" ? " · 训练" : s.phase === "inference" ? " · 推理" : "";
      document.getElementById("stepBadge").textContent = `Step ${state.stepIndex + 1} / ${steps.length}${phaseTag}`;
      document.getElementById("stepTitle").innerHTML = renderInlineMath(s.title || "");
      document.getElementById("stepNarration").innerHTML = renderInlineMath(s.narration || "");
      document.getElementById("btnPrevStep").disabled = state.stepIndex === 0;
      document.getElementById("btnNextStep").disabled = state.stepIndex === steps.length - 1;
      document.getElementById("stepProgressFill").style.width = `${((state.stepIndex + 1) / steps.length) * 100}%`;

      const sel = document.getElementById("stepSelect");
      sel.innerHTML = steps
        .map((st, i) => `<button type="button" class="btn btn-sm" data-step="${i}" aria-current="${i === state.stepIndex ? "step" : "false"}">${i + 1}. ${renderInlineMath(st.title)}</button>`)
        .join("");
    }

    /* ---------------- Shared Module Detail Blocks ---------------- */
    function formatIOList(items) {
      if (!items || !items.length) return `<div class="io-chip" style="color:var(--text-muted);">—</div>`;
      return `<div class="io-chips">${items.map((it) => `
        <div class="io-chip">
          <span>${renderInlineMath(it.name || "")}</span>
          ${it.shape ? `<span class="io-shape">${renderSymbol(it.shape)}</span>` : ""}
          ${it.dtype ? `<span class="io-dtype">${escapeHtml(it.dtype)}</span>` : ""}
        </div>
      `).join("")}</div>`;
    }

    function buildMechanicsHtml(node) {
      const mech = node.mechanics || {};
      return `
        <div class="section-block">
          <h4 class="section-label">核心直觉与机制</h4>
          <p class="prose">${renderInlineMath(mech.intuition || "暂无说明。")}</p>
        </div>
        ${mech.formula_latex ? `
          <div class="section-block">
            <h4 class="section-label">数学表达</h4>
            ${renderDisplayMath(mech.formula_latex)}
            ${(mech.formula_notes && mech.formula_notes.length) ? `
              <ul class="bullet-list">
                ${mech.formula_notes.map((n) => `<li>${renderInlineMath(n)}</li>`).join("")}
              </ul>
            ` : ""}
          </div>
        ` : ""}
        ${mech.pseudocode ? `
          <div class="section-block">
            <h4 class="section-label">PyTorch 风格伪代码</h4>
            <pre class="code-block">${escapeHtml(mech.pseudocode)}</pre>
          </div>
        ` : ""}
      `;
    }

    function buildRationaleHtml(node) {
      const rat = node.rationale || {};
      if (!rat.why_here && !(rat.alternatives && rat.alternatives.length) && !rat.ablation_impact && !rat.implementation_notes) {
        return "";
      }
      return `
        ${rat.why_here ? `
          <div class="section-block">
            <h4 class="section-label">设计动机</h4>
            <p class="prose">${renderInlineMath(rat.why_here)}</p>
          </div>
        ` : ""}
        ${(rat.alternatives && rat.alternatives.length) ? `
          <div class="section-block">
            <h4 class="section-label">替代方案与权衡</h4>
            <ul class="bullet-list">
              ${rat.alternatives.map((a) => `<li>${renderInlineMath(a)}</li>`).join("")}
            </ul>
          </div>
        ` : ""}
        ${rat.ablation_impact ? `
          <div class="section-block">
            <h4 class="section-label">消融直觉（移除或替换的影响）</h4>
            <div class="callout warn">${renderInlineMath(rat.ablation_impact)}</div>
          </div>
        ` : ""}
        ${rat.implementation_notes ? `
          <div class="section-block">
            <h4 class="section-label">工程实现与训练细节</h4>
            <div class="callout">${renderInlineMath(rat.implementation_notes)}</div>
          </div>
        ` : ""}
      `;
    }

    function buildKnowledgeHtml(node, omitEmpty) {
      const concepts = node.concepts || [];
      const papers = node.papers || [];
      if (omitEmpty && !concepts.length && !papers.length) return "";
      return `
        ${concepts.length || !omitEmpty ? `
          <div class="section-block">
            <h4 class="section-label">前置知识点</h4>
