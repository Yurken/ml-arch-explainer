<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__PAGE_TITLE__ · 架构深度精读</title>
  <!--__KATEX_BUNDLE__-->
  <style>
    :root {
      --bg-paper: #FCFBF8;
      --bg-card: #FFFFFF;
      --bg-subtle: #F5F3EE;
      --bg-code: #F7F6F2;
      --border: #E5E2D9;
      --border-strong: #CFCBC0;
      --text-primary: #1D2126;
      --text-secondary: #535A63;
      --text-muted: #7C848E;
      --accent: #2C4A7A;
      --accent-soft: #EEF3FA;
      --amber: #B45309;
      --crimson: #B91C1C;
      --emerald: #047857;
      --shadow-sm: 0 1px 2px rgba(24, 24, 27, 0.04);
      --shadow-md: 0 8px 24px rgba(24, 24, 27, 0.06);
      --font-serif: "Source Serif 4", "Noto Serif SC", Georgia, "Songti SC", serif;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --radius: 10px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-paper);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14.5px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Masthead */
    .masthead {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 28px 32px 22px;
    }
    .masthead-inner {
      max-width: 1520px;
      margin: 0 auto;
    }
    .kicker-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .kicker-badge {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 9px;
      border-radius: 999px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
    }
    .title {
      font-family: var(--font-serif);
      font-size: clamp(24px, 2.6vw, 34px);
      font-weight: 700;
      line-height: 1.22;
      margin: 0 0 6px;
      color: var(--text-primary);
    }
    .subtitle {
      font-family: var(--font-serif);
      font-size: 15.5px;
      color: var(--text-secondary);
      margin: 0 0 16px;
    }
    .core-insight {
      margin: 0 0 18px;
      padding: 12px 16px;
      border-left: 3px solid var(--accent);
      background: var(--bg-paper);
      border-radius: 0 8px 8px 0;
      font-size: 14.5px;
      color: var(--text-primary);
    }
    .core-insight strong {
      color: var(--accent);
      font-weight: 600;
      margin-right: 6px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      padding: 2px 9px;
      border-radius: 999px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn:hover { background: var(--bg-subtle); border-color: #B4AFA3; }
    .btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Workspace */
    .workspace {
      max-width: 1520px;
      margin: 22px auto 0;
      padding: 0 28px;
      display: grid;
      grid-template-columns: minmax(0, 1.32fr) minmax(380px, 0.92fr);
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 1120px) {
      .workspace { grid-template-columns: 1fr; padding: 0 16px; }
      .masthead { padding: 20px 16px; }
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    /* Left Canvas Panel */
    .canvas-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      background: #FDFCFA;
    }
    .canvas-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .canvas-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn-sm {
      padding: 4px 9px;
      font-size: 12px;
      border-radius: 6px;
    }

    .canvas-stage {
      position: relative;
      height: 560px;
      background:
        radial-gradient(#E3E0D6 1px, transparent 1px) 0 0 / 20px 20px,
        #FCFBF8;
      overflow: hidden;
      user-select: none;
    }
    .canvas-stage.split-mode {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      height: 660px;
    }
    @media (max-width: 720px) {
      .canvas-stage.split-mode { grid-template-columns: 1fr; grid-template-rows: 1fr 220px; }
    }
    .svg-viewport {
      width: 100%;
      height: 100%;
      cursor: grab;
      overflow: hidden;
      position: relative;
    }
    .svg-viewport:active { cursor: grabbing; }
    .svg-viewport svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .orig-image-pane {
      width: 100%;
      height: 100%;
      background: #F6F5F0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow: auto;
      position: relative;
    }
    .canvas-stage.split-mode .orig-image-pane {
      border-top: 1px solid var(--border);
    }
    .orig-image-pane img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: var(--shadow-sm);
      background: #FFF;
      cursor: zoom-in;
    }
    .orig-caption {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* Legend bar */
    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 16px;
      border-top: 1px solid var(--border);
      background: #FDFCFA;
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .legend-line {
      width: 22px;
      height: 0;
      border-top: 2px solid #475569;
      display: inline-block;
    }
    .legend-line.residual { border-top: 2px dashed #4F46E5; }
    .legend-line.conditioning { border-top: 2px dotted #B45309; }
    .legend-line.loss { border-top: 2px dashed #B91C1C; }

    /* Stepper */
    .stepper {
      border-top: 1px solid var(--border);
      padding: 14px 16px;
      background: var(--bg-card);
    }
    .stepper-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .step-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .step-badge {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .step-title {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .step-narration {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin: 0 0 12px;
      line-height: 1.6;
    }
    .step-dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .step-dot {
      border: 1px solid var(--border-strong);
      background: var(--bg-paper);
      color: var(--text-secondary);
      font-size: 11.5px;
      font-family: var(--font-mono);
      padding: 2px 8px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .step-dot:hover { border-color: var(--accent); color: var(--accent); }
    .step-dot.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFF;
    }

    /* SVG Nodes & Edges */
    .arch-node { cursor: pointer; transition: opacity 0.2s ease; }
    .arch-node.dimmed { opacity: 0.34; }
    .arch-node .node-box {
      transition: filter 0.15s ease, stroke-width 0.15s ease;
    }
    .arch-node:hover .node-box {
      filter: drop-shadow(0 4px 10px rgba(30, 41, 59, 0.12));
    }
    .arch-node.selected .node-box {
      stroke-width: 2.6px;
      filter: drop-shadow(0 6px 14px rgba(44, 74, 122, 0.22));
    }
    .arch-edge { transition: opacity 0.2s ease; }
    .arch-edge.dimmed { opacity: 0.2; }
    .arch-edge.active-flow path.edge-path {
      stroke-dasharray: 8 5;
      animation: flowDash 0.9s linear infinite;
      stroke-width: 2.6px;
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -26; }
    }

    /* Right Inspector Panel */
    .inspector {
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 1120px) {
      .inspector { position: static; max-height: none; }
    }
    .inspector-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      background: #FDFCFA;
    }
    .cat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .inspector-title {
      font-family: var(--font-serif);
      font-size: 21px;
      font-weight: 700;
      line-height: 1.28;
      margin: 0 0 4px;
    }
    .inspector-role {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin: 0 0 12px;
    }
    .io-strip {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
      background: var(--bg-paper);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
    }
    .io-col-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .io-item {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-primary);
      line-height: 1.45;
      word-break: break-word;
    }
    .io-shape {
      color: var(--accent);
      font-weight: 500;
    }
    .io-arrow {
      color: var(--text-muted);
      font-size: 16px;
      text-align: center;
    }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      padding: 0 16px;
      gap: 4px;
    }
    .tab-btn {
      appearance: none;
      border: none;
      background: transparent;
      padding: 11px 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      font-family: var(--font-sans);
      transition: color 0.15s;
    }
    .tab-btn:hover { color: var(--text-primary); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    .inspector-body {
      padding: 18px 20px 22px;
      overflow-y: auto;
      flex: 1;
    }
    .section-block { margin-bottom: 18px; }
    .section-block:last-child { margin-bottom: 0; }
    .section-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .prose {
      font-size: 14px;
      color: var(--text-primary);
      margin: 0;
      line-height: 1.7;
    }
    .formula-box {
      background: var(--bg-paper);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 14px;
      overflow-x: auto;
      text-align: center;
      margin-bottom: 10px;
    }
    .formula-fallback {
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--text-primary);
    }
    .bullet-list {
      margin: 0;
      padding-left: 18px;
      color: var(--text-secondary);
      font-size: 13.5px;
    }
    .bullet-list li { margin-bottom: 6px; }

    pre.code-block {
      margin: 0;
      padding: 12px 14px;
      background: var(--bg-code);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 12.2px;
      line-height: 1.55;
      color: #24292F;
      overflow-x: auto;
      white-space: pre;
    }

    .callout {
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-paper);
      font-size: 13.5px;
      color: var(--text-secondary);
    }
    .callout.warn {
      border-color: #F3DFC1;
      background: #FFFBF4;
      color: #7C4A03;
    }

    /* Concept cards */
    .concept-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: var(--bg-paper);
    }
    .concept-term {
      font-weight: 600;
      font-size: 13.5px;
      color: var(--text-primary);
      margin-bottom: 3px;
    }
    .concept-brief {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0;
    }

    /* Paper cards */
    .paper-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      background: var(--bg-card);
      transition: border-color 0.15s;
    }
    .paper-card:hover { border-color: var(--border-strong); }
    .paper-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .paper-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 14.5px;
      color: var(--text-primary);
      line-height: 1.35;
    }
    .rel-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .rel-foundational { background: #EEF2FF; color: #3730A3; }
    .rel-direct_predecessor { background: #FEF3C7; color: #92400E; }
    .rel-alternative { background: #F0FDFA; color: #0F766E; }
    .rel-follow_up { background: #F5F3FF; color: #6D28D9; }

    .paper-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .verify-pill {
      font-size: 10.5px;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .verify-pill.verified { background: #ECFDF5; color: #047857; border-color: #A7F3D0; }
    .verify-pill.search { background: #F8FAFC; color: #64748B; }
    .paper-takeaway {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0 0 8px;
    }
    .paper-link {
      font-size: 12px;
      font-weight: 500;
    }

    /* Below-the-fold Academic Appendix */
    .appendix {
      max-width: 1520px;
      margin: 28px auto 64px;
      padding: 0 28px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (max-width: 1120px) {
      .appendix { padding: 0 16px; }
    }
    .appendix-card {
      min-width: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      box-shadow: var(--shadow-sm);
    }
    .appendix-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .two-col {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      gap: 20px;
    }
    @media (max-width: 960px) {
      .two-col { grid-template-columns: 1fr; }
    }

    table.trace-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    table.trace-table th,
    table.trace-table td {
      text-align: left;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    table.trace-table th {
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      background: var(--bg-paper);
      font-weight: 600;
    }
    table.trace-table tr:hover td { background: #FAF9F5; cursor: pointer; }
    .mono { font-family: var(--font-mono); font-size: 12px; }

    .glossary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .glossary-item {
      border: 1px solid var(--border);
      background: var(--bg-paper);
      border-radius: 7px;
      padding: 8px 11px;
      display: flex;
      gap: 10px;
      align-items: baseline;
    }
    .glossary-sym {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--accent);
      font-size: 13px;
      min-width: 34px;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 95vw;
      max-height: 92vh;
      background: #FFF;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="kicker-row" id="kickerRow"></div>
      <h1 class="title" id="pageTitle"></h1>
      <p class="subtitle" id="pageSubtitle"></p>
      <p id="sourcePaper" hidden></p>
      <div class="core-insight" id="coreInsight"></div>
      <div class="toolbar">
        <div class="tag-list" id="tagList"></div>
        <div class="btn-group">
          <button class="btn active" id="btnViewGraph" onclick="setViewMode('graph')">交互架构图</button>
          <button class="btn" id="btnViewSplit" onclick="setViewMode('split')">双屏对照</button>
          <button class="btn" id="btnViewImage" onclick="setViewMode('image')">原始架构图</button>
          <button class="btn primary" id="btnToggleWalkthrough" onclick="toggleWalkthrough()">▶ 单步张量演进</button>
        </div>
      </div>
    </div>
  </header>

  <main class="workspace">
    <!-- Left: Interactive Architecture Canvas -->
    <section class="panel">
      <div class="canvas-header">
        <div class="canvas-title">
          <span>模型计算图</span>
          <span style="font-weight:400; color:var(--text-muted);" id="canvasHint">点击任意模块查看深度解析 · 滚轮缩放 / 拖拽画布</span>
        </div>
        <div class="canvas-controls" id="graphControls">
          <button class="btn btn-sm" onclick="toggleLayout()" id="btnLayout">切换竖排</button>
          <button class="btn btn-sm" onclick="zoomCanvas(1.18)">＋</button>
          <button class="btn btn-sm" onclick="zoomCanvas(0.85)">－</button>

          <span class="legend-item"><span class="legend-line"></span>主干数据流</span>
          <span class="legend-item"><span class="legend-line residual"></span>残差 / 跳跃连接</span>

            <button class="btn btn-sm" id="btnPrevStep" onclick="goStep(state.stepIndex - 1)">◀ 上一步</button>
            <button class="btn btn-sm" id="btnNextStep" onclick="goStep(state.stepIndex + 1)">下一步 ▶</button>

    <!-- Right: Deep Inspector -->

      </div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="mechanics" onclick="setTab('mechanics')">原理与公式</button>
        <button class="tab-btn" data-tab="rationale" onclick="setTab('rationale')">设计动机</button>
        <button class="tab-btn" data-tab="knowledge" onclick="setTab('knowledge')">知识与论文</button>

      <div class="inspector-body" id="inspectorBody"></div>
    </aside>
  </main>

  <!-- Below-the-fold Academic Appendix -->
  <section class="appendix">
    <div class="appendix-card" id="overviewCard">
      <h3 class="appendix-title">架构总览与端到端张量追踪</h3>
      <p class="prose" id="overviewSummary" style="margin-bottom: 16px;"></p>
      <div style="overflow-x:auto;">
        <table class="trace-table">
          <thead>
            <tr>
              <th style="width:60px;">阶段</th>
              <th style="width:220px;">模块</th>
              <th style="width:210px;">输入形态</th>
              <th style="width:210px;">输出形态</th>
              <th>核心变换职责</th>

          <tbody id="traceTableBody"></tbody>

    <div class="two-col">
      <div class="appendix-card">
        <h3 class="appendix-title">关联论文谱系汇总</h3>
        <div id="bibList"></div>
      </div>
      <div class="appendix-card">
        <h3 class="appendix-title">符号与维度词典</h3>
        <div class="glossary-grid" id="glossaryGrid"></div>
        <div id="uncertaintyWrap" style="margin-top:20px; display:none;">
          <h4 class="section-label">图面推断与不确定性说明</h4>
          <div class="callout warn" id="uncertaintyList"></div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" alt="Enlarged Architecture Diagram" />
  </div>

  <script>
    const ARCH_DATA = /*__ARCH_DATA_PLACEHOLDER__*/null;
    const IMAGE_DATA_URI = /*__IMAGE_URI_PLACEHOLDER__*/"";

    const CATEGORY_STYLE = {
      input:      { label: "输入表征",   fill: "#F1F5F9", stroke: "#475569", text: "#1E293B" },
      encoder:    { label: "编码 / 主干", fill: "#EEF2FF", stroke: "#3730A3", text: "#1E1B4B" },
      attention:  { label: "注意力 / 融合", fill: "#FEF3C7", stroke: "#B45309", text: "#78350F" },
      projection: { label: "投影 / 归一化", fill: "#F0FDFA", stroke: "#0F766E", text: "#134E4A" },
      decoder:    { label: "解码 / 生成", fill: "#F5F3FF", stroke: "#6D28D9", text: "#3B0764" },
      loss:       { label: "损失 / 监督", fill: "#FEF2F2", stroke: "#B91C1C", text: "#7F1D1D" },
      output:     { label: "最终输出",   fill: "#ECFDF5", stroke: "#047857", text: "#064E3B" }
    };

    const EDGE_STYLE = {
      main:         { stroke: "#475569", dash: "",      marker: "arrow-main" },
      residual:     { stroke: "#4F46E5", dash: "6 4",   marker: "arrow-residual" },
      conditioning: { stroke: "#B45309", dash: "2 4",   marker: "arrow-cond" },
      loss:         { stroke: "#B91C1C", dash: "5 3",   marker: "arrow-loss" }
    };

    const RELATION_LABEL = {
      foundational:       { text: "奠基工作", cls: "rel-foundational" },
      direct_predecessor: { text: "直接前作", cls: "rel-direct_predecessor" },
      alternative:        { text: "同类方案", cls: "rel-alternative" },
      follow_up:          { text: "后续演进", cls: "rel-follow_up" }
    };

    const state = {
      selectedNodeId: null,
      activeTab: "mechanics",
      viewMode: "graph",
      layout: (ARCH_DATA && ARCH_DATA.meta && ARCH_DATA.meta.default_layout) || "horizontal",
      walkthrough: false,
      stepIndex: 0,
      cam: { x: 0, y: 0, scale: 1 },
      graphBounds: { w: 1000, h: 500 },
      nodeMap: new Map()
    };

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function decodeBasicEntities(str) {
      return str
        .replace(/&lt;/g, "<")
        .replace(/&gt;/g, ">")
        .replace(/&amp;/g, "&")
        .replace(/&quot;/g, "\"")
        .replace(/&#39;/g, "'");
    }

    function renderInlineMath(text) {
      const escaped = escapeHtml(text || "");
      if (typeof katex === "undefined") return escaped;
      return escaped.replace(/\$([^$\n]+?)\$/g, (_, expr) => {
        try {
          return katex.renderToString(decodeBasicEntities(expr), {
            displayMode: false,
            throwOnError: false
          });
        } catch (e) {
          return `<code>${expr}</code>`;
        }
      });
    }

    function renderDisplayMath(latex) {
      if (!latex) return "";
      if (typeof katex === "undefined") {
        return `<div class="formula-box"><code class="formula-fallback">${escapeHtml(latex)}</code></div>`;
      }
      try {
        const html = katex.renderToString(latex, { displayMode: true, throwOnError: false });
        return `<div class="formula-box">${html}</div>`;
      } catch (e) {
        return `<div class="formula-box"><code class="formula-fallback">${escapeHtml(latex)}</code></div>`;
      }
    }

    function init() {
      if (!ARCH_DATA) {
        document.body.innerHTML = "<p style='padding:40px;'>未检测到注入的架构数据。</p>";
        return;
      }
      ARCH_DATA.nodes.forEach((n) => state.nodeMap.set(n.id, n));

      // Header
      const m = ARCH_DATA.meta || {};
      if (m.source_paper) {
        const source = document.getElementById("sourcePaper");
        source.textContent = "原文 · " + m.source_paper.title + " · " + m.source_paper.figure;
        source.hidden = false;
      }
      const kickerParts = [];
      if (m.domain) kickerParts.push(`<span class="kicker-badge">${escapeHtml(m.domain)}</span>`);
      if (m.venue_year) kickerParts.push(`<span>${escapeHtml(m.venue_year)}</span>`);
      kickerParts.push(`<span>共 ${ARCH_DATA.nodes.length} 个核心模块 · ${ARCH_DATA.steps.length} 步计算流程</span>`);
      document.getElementById("kickerRow").innerHTML = kickerParts.join(" · ");
      document.getElementById("pageTitle").textContent = m.title || "ML Architecture Guide";
      document.getElementById("pageSubtitle").textContent = m.subtitle || "";
      document.getElementById("coreInsight").innerHTML =
        `<strong>核心洞见</strong>${renderInlineMath(m.core_insight || "")}`;
      document.getElementById("tagList").innerHTML = (m.tags || [])
        .map((t) => `<span class="tag"># ${escapeHtml(t)}</span>`)
        .join("");

      // Image availability
      if (IMAGE_DATA_URI) {
        document.getElementById("origImageEl").src = IMAGE_DATA_URI;
        document.getElementById("lightboxImg").src = IMAGE_DATA_URI;
      } else {
        document.getElementById("btnViewSplit").style.display = "none";
        document.getElementById("btnViewImage").style.display = "none";
      }

      // Initial node selection
      const firstStep = (ARCH_DATA.steps || [])[0];
      state.selectedNodeId =
        (firstStep && firstStep.focus_node) ||
        (ARCH_DATA.nodes[0] && ARCH_DATA.nodes[0].id);

      document.addEventListener("click", (event) => {
        const item = event.target.closest("[data-node]");
        if (!item) return;
        selectNode(item.dataset.node);
        if (item.closest("table")) document.querySelector(".inspector").scrollIntoView({ behavior: "smooth" });
      });
      document.getElementById("archSvg").addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const item = event.target.closest("[data-node]");
        if (!item) return;
        event.preventDefault();
        selectNode(item.dataset.node);
        document.querySelector("#archSvg .arch-node.selected").focus();
      });
      setupPanZoom();
      renderGraph();
      resetCamera();
      renderStepper();
      renderInspector();
      renderAppendix();

    }

    /* ---------------- Graph Layout & Rendering ---------------- */
    function computePositions() {
      const horiz = state.layout === "horizontal";
      const nodeW = horiz ? 190 : 220;
      const nodeH = horiz ? 76 : 68;
      const gapX = horiz ? 96 : 56;
      const gapY = horiz ? 42 : 82;
      const pad = 64;

      const groups = new Map();
      ARCH_DATA.nodes.forEach((n, idx) => {
        const s = typeof n.stage === "number" ? n.stage : idx;
        if (!groups.has(s)) groups.set(s, []);
        groups.get(s).push(n);
      });

      const stages = Array.from(groups.keys()).sort((a, b) => a - b);
      let maxPerStage = 1;
      stages.forEach((s) => {
        groups.get(s).sort((a, b) => (a.lane || 0) - (b.lane || 0));
        maxPerStage = Math.max(maxPerStage, groups.get(s).length);
      });

      const pos = new Map();
      const maxSpanY = maxPerStage * nodeH + (maxPerStage - 1) * gapY;
      const maxSpanX = maxPerStage * nodeW + (maxPerStage - 1) * gapX;

      stages.forEach((s, sIdx) => {
        const list = groups.get(s);
        if (horiz) {
          const colH = list.length * nodeH + (list.length - 1) * gapY;
          const startY = pad + (maxSpanY - colH) / 2;
          const x = pad + sIdx * (nodeW + gapX);
          list.forEach((n, lIdx) => {
            pos.set(n.id, {
              x,
              y: startY + lIdx * (nodeH + gapY),
              w: nodeW,
              h: nodeH,
              stageIdx: sIdx,
              laneIdx: lIdx,
              laneCount: list.length
            });
          });
        } else {
          const rowW = list.length * nodeW + (list.length - 1) * gapX;
          const startX = pad + (maxSpanX - rowW) / 2;
          const y = pad + sIdx * (nodeH + gapY);
          list.forEach((n, lIdx) => {
            pos.set(n.id, {
              x: startX + lIdx * (nodeW + gapX),
              y,
              w: nodeW,
              h: nodeH,
              stageIdx: sIdx,
              laneIdx: lIdx,
              laneCount: list.length
            });
          });
        }
      });

      const totalW = horiz
        ? pad * 2 + stages.length * nodeW + Math.max(0, stages.length - 1) * gapX
        : pad * 2 + maxSpanX;
      const totalH = horiz
        ? pad * 2 + maxSpanY
        : pad * 2 + stages.length * nodeH + Math.max(0, stages.length - 1) * gapY;

      state.graphBounds = { w: Math.max(totalW, 600), h: Math.max(totalH, 360) };
      return pos;
    }

    function cubicMidpoint(p0, p1, p2, p3) {
      return {
        x: 0.125 * p0.x + 0.375 * p1.x + 0.375 * p2.x + 0.125 * p3.x,
        y: 0.125 * p0.y + 0.375 * p1.y + 0.375 * p2.y + 0.125 * p3.y
      };
    }

    function buildEdgeGeometry(sp, tp, edge, horiz) {
      const stageDiff = tp.stageIdx - sp.stageIdx;
      let p0, p1, p2, p3;

      if (horiz) {
        if (stageDiff === 1) {
          p0 = { x: sp.x + sp.w, y: sp.y + sp.h / 2 };
          p3 = { x: tp.x, y: tp.y + tp.h / 2 };
          const dx = Math.max(32, (p3.x - p0.x) * 0.45);
          p1 = { x: p0.x + dx, y: p0.y };
          p2 = { x: p3.x - dx, y: p3.y };
        } else if (stageDiff > 1) {
          const archAbove = edge.type !== "loss" && sp.laneIdx === 0;
          const lift = (archAbove ? -1 : 1) * (58 + Math.min(stageDiff, 4) * 18);
          p0 = { x: sp.x + sp.w * 0.7, y: archAbove ? sp.y : sp.y + sp.h };
          p3 = { x: tp.x + tp.w * 0.3, y: archAbove ? tp.y : tp.y + tp.h };
          p1 = { x: p0.x + 25, y: p0.y + lift };
          p2 = { x: p3.x - 25, y: p3.y + lift };
        } else if (stageDiff === 0) {
          const goingDown = tp.y > sp.y;
          p0 = { x: sp.x + sp.w / 2, y: goingDown ? sp.y + sp.h : sp.y };
          p3 = { x: tp.x + tp.w / 2, y: goingDown ? tp.y : tp.y + tp.h };
          p1 = { x: p0.x, y: (p0.y + p3.y) / 2 };
          p2 = { x: p3.x, y: (p0.y + p3.y) / 2 };
        } else {
          // Feedback / loop edge
          p0 = { x: sp.x + sp.w / 2, y: sp.y + sp.h };
          p3 = { x: tp.x + tp.w / 2, y: tp.y + tp.h };
          const drop = 76;
          p1 = { x: p0.x, y: Math.max(p0.y, p3.y) + drop };
          p2 = { x: p3.x, y: Math.max(p0.y, p3.y) + drop };
        }
      } else {
        if (stageDiff === 1) {
          p0 = { x: sp.x + sp.w / 2, y: sp.y + sp.h };
          p3 = { x: tp.x + tp.w / 2, y: tp.y };
          const dy = Math.max(28, (p3.y - p0.y) * 0.45);
          p1 = { x: p0.x, y: p0.y + dy };
          p2 = { x: p3.x, y: p3.y - dy };
        } else if (stageDiff > 1) {
          const archRight = sp.laneIdx >= tp.laneIdx;
          const shift = (archRight ? 1 : -1) * (66 + Math.min(stageDiff, 4) * 16);
          p0 = { x: archRight ? sp.x + sp.w : sp.x, y: sp.y + sp.h * 0.65 };
          p3 = { x: archRight ? tp.x + tp.w : tp.x, y: tp.y + tp.h * 0.35 };
          p1 = { x: p0.x + shift, y: p0.y + 18 };
          p2 = { x: p3.x + shift, y: p3.y - 18 };
        } else if (stageDiff === 0) {
          const goingRight = tp.x > sp.x;
          p0 = { x: goingRight ? sp.x + sp.w : sp.x, y: sp.y + sp.h / 2 };
          p3 = { x: goingRight ? tp.x : tp.x + tp.w, y: tp.y + tp.h / 2 };
          p1 = { x: (p0.x + p3.x) / 2, y: p0.y };
          p2 = { x: (p0.x + p3.x) / 2, y: p3.y };
        } else {
          p0 = { x: sp.x + sp.w, y: sp.y + sp.h / 2 };
          p3 = { x: tp.x + tp.w, y: tp.y + tp.h / 2 };
          const shift = 82;
          p1 = { x: Math.max(p0.x, p3.x) + shift, y: p0.y };
          p2 = { x: Math.max(p0.x, p3.x) + shift, y: p3.y };
        }
      }

      const d = `M ${p0.x} ${p0.y} C ${p1.x} ${p1.y}, ${p2.x} ${p2.y}, ${p3.x} ${p3.y}`;
      const mid = cubicMidpoint(p0, p1, p2, p3);
      return { d, mid };
    }

    function getActiveSets() {
      if (!state.walkthrough) {
        return { activeNodes: null, activeEdges: null };
      }
      const step = ARCH_DATA.steps[state.stepIndex];
      if (!step) return { activeNodes: null, activeEdges: null };
      const activeNodes = new Set(step.active_nodes || []);
      const activeEdges = new Set(step.active_edges || []);
      // Auto-include edges connecting active nodes if active_edges omitted
      if (!Array.isArray(step.active_edges)) {
        ARCH_DATA.edges.forEach((e) => {
          if (activeNodes.has(e.source) && activeNodes.has(e.target)) {
            activeEdges.add(e.id);
          }
        });
      }
      return { activeNodes, activeEdges };
    }

    function renderGraph() {
      const svg = document.getElementById("archSvg");
      const pos = computePositions();
      const horiz = state.layout === "horizontal";
      const { activeNodes, activeEdges } = getActiveSets();

      document.getElementById("btnLayout").textContent = horiz ? "切换竖排" : "切换横排";

      let defs = `
        <defs>
          <marker id="arrow-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#475569" />
          </marker>
          <marker id="arrow-residual" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#4F46E5" />
          </marker>
          <marker id="arrow-cond" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#B45309" />
          </marker>
          <marker id="arrow-loss" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#B91C1C" />
          </marker>
        </defs>
      `;

      let edgesSvg = "";
      ARCH_DATA.edges.forEach((edge, idx) => {
        const sp = pos.get(edge.source);
        const tp = pos.get(edge.target);
        if (!sp || !tp) return;

        const eid = edge.id || `edge_${idx}`;
        const est = EDGE_STYLE[edge.type] || EDGE_STYLE.main;
        const { d, mid } = buildEdgeGeometry(sp, tp, edge, horiz);
        const isActive = activeEdges && activeEdges.has(eid);
        const isDimmed = activeEdges && !isActive;
        const isConnectedToSelected =
          !state.walkthrough &&
          (edge.source === state.selectedNodeId || edge.target === state.selectedNodeId);

        const cls = [
          "arch-edge",
          isDimmed ? "dimmed" : "",
          isActive || isConnectedToSelected ? "active-flow" : ""
        ].join(" ");

        const pillText = edge.tensor_shape || edge.label || "";
        const pillW = Math.min(130, Math.max(44, pillText.length * 6.8 + 14));

        edgesSvg += `
          <g class="${cls}"><title>${escapeHtml(edge.description || edge.label || "")}</title>
            <path class="edge-path" d="${d}" fill="none" stroke="${est.stroke}"
              stroke-width="${isActive || isConnectedToSelected ? 2.4 : 1.7}"
              ${est.dash ? `stroke-dasharray="${est.dash}"` : ""}
              marker-end="url(#${est.marker})" />
            ${pillText ? `
              <g transform="translate(${mid.x}, ${mid.y})">
                <rect x="${-pillW / 2}" y="-10" width="${pillW}" height="20" rx="10"
                  fill="#FFFFFF" stroke="${est.stroke}" stroke-opacity="0.45" stroke-width="1" />
                <text text-anchor="middle" y="3.5" font-family="var(--font-mono)"
                  font-size="10.2" fill="#334155">${escapeHtml(pillText.slice(0, 18))}</text>
              </g>
            ` : ""}
          </g>
        `;
      });

      let nodesSvg = "";
      ARCH_DATA.nodes.forEach((node) => {
        const p = pos.get(node.id);
        if (!p) return;
        const st = CATEGORY_STYLE[node.category] || CATEGORY_STYLE.encoder;
        const isSelected = node.id === state.selectedNodeId;
        const isDimmed = activeNodes && !activeNodes.has(node.id);
        const label = node.short_name || node.name;
        const outShape =
          node.io && node.io.outputs && node.io.outputs[0] && node.io.outputs[0].shape
            ? node.io.outputs[0].shape
            : "";

        nodesSvg += `
          <g class="arch-node ${isSelected ? "selected" : ""} ${isDimmed ? "dimmed" : ""}"
             transform="translate(${p.x}, ${p.y})"
             data-node="${escapeHtml(node.id)}" role="button" tabindex="0" aria-label="${escapeHtml(node.name)}">
            <rect class="node-box" width="${p.w}" height="${p.h}" rx="10"
              fill="${st.fill}" stroke="${st.stroke}" stroke-width="${isSelected ? 2.6 : 1.4}" />
            <rect x="0" y="0" width="6" height="${p.h}" rx="3" fill="${st.stroke}" />
            <text x="16" y="21" font-family="var(--font-sans)" font-size="10.5"
              font-weight="600" fill="${st.stroke}" opacity="0.9">${escapeHtml(st.label)}</text>
            ${node.repeat_badge ? `
              <rect x="${p.w - 42}" y="8" width="32" height="17" rx="8.5" fill="${st.stroke}" />
              <text x="${p.w - 26}" y="20" text-anchor="middle" font-family="var(--font-mono)"
                font-size="10" font-weight="600" fill="#FFFFFF">${escapeHtml(node.repeat_badge)}</text>
            ` : ""}
            <text x="16" y="42" font-family="var(--font-sans)" font-size="13"
              font-weight="600" fill="${st.text}">${escapeHtml(label.length > 22 ? label.slice(0, 21) + "…" : label)}</text>
            ${outShape ? `
              <text x="16" y="60" font-family="var(--font-mono)" font-size="10.5"
                fill="#52525B">→ ${escapeHtml(outShape.length > 24 ? outShape.slice(0, 23) + "…" : outShape)}</text>
            ` : ""}
          </g>
        `;
      });

      svg.innerHTML = `
        ${defs}
        <g id="cameraGroup" transform="translate(${state.cam.x}, ${state.cam.y}) scale(${state.cam.scale})">
          ${edgesSvg}
          ${nodesSvg}
        </g>
      `;
    }

    function applyCamera() {
      const g = document.getElementById("cameraGroup");
      if (g) g.setAttribute("transform", `translate(${state.cam.x}, ${state.cam.y}) scale(${state.cam.scale})`);
    }

    function resetCamera() {
      const vp = document.getElementById("svgViewport");
      if (!vp) return;
      const vw = vp.clientWidth || 760;
      const vh = vp.clientHeight || 520;
      const sx = (vw - 24) / state.graphBounds.w;
      const sy = (vh - 24) / state.graphBounds.h;
      const scale = Math.min(1.12, Math.min(sx, sy));
      state.cam.scale = scale;
      state.cam.x = (vw - state.graphBounds.w * scale) / 2;
      state.cam.y = (vh - state.graphBounds.h * scale) / 2;
      applyCamera();
    }

    function zoomCanvas(factor) {
      const vp = document.getElementById("svgViewport");
      const cx = (vp.clientWidth || 760) / 2;
      const cy = (vp.clientHeight || 520) / 2;
      const next = Math.min(2.4, Math.max(0.3, state.cam.scale * factor));
      const ratio = next / state.cam.scale;
      state.cam.x = cx - (cx - state.cam.x) * ratio;
      state.cam.y = cy - (cy - state.cam.y) * ratio;
      state.cam.scale = next;
      applyCamera();
    }

    function setupPanZoom() {
      const vp = document.getElementById("svgViewport");
      let dragging = false;
      let startX = 0, startY = 0;

      vp.addEventListener("mousedown", (e) => {
        if (e.target.closest(".arch-node")) return;
        dragging = true;
        startX = e.clientX - state.cam.x;
        startY = e.clientY - state.cam.y;
      });
      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        state.cam.x = e.clientX - startX;
        state.cam.y = e.clientY - startY;
        applyCamera();
      });
      window.addEventListener("mouseup", () => { dragging = false; });

      vp.addEventListener("wheel", (e) => {
        e.preventDefault();
        const rect = vp.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const factor = e.deltaY < 0 ? 1.1 : 0.91;
        const next = Math.min(2.4, Math.max(0.3, state.cam.scale * factor));
        const ratio = next / state.cam.scale;
        state.cam.x = mx - (mx - state.cam.x) * ratio;
        state.cam.y = my - (my - state.cam.y) * ratio;
        state.cam.scale = next;
        applyCamera();
      }, { passive: false });
    }

    /* ---------------- Interactions ---------------- */
    function selectNode(nodeId) {
      if (!state.nodeMap.has(nodeId)) return;
      state.selectedNodeId = nodeId;
      renderGraph();
      renderInspector();
    }

    function setTab(tab) {
      state.activeTab = tab;
      document.querySelectorAll(".tab-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.tab === tab);
      });
      renderInspector();
    }

    function toggleLayout() {
      state.layout = state.layout === "horizontal" ? "vertical" : "horizontal";
      renderGraph();
      resetCamera();
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      const stage = document.getElementById("canvasStage");
      const vp = document.getElementById("svgViewport");
      const imgPane = document.getElementById("origImagePane");
      const controls = document.getElementById("graphControls");

      document.getElementById("btnViewGraph").classList.toggle("active", mode === "graph");
      document.getElementById("btnViewSplit").classList.toggle("active", mode === "split");
      document.getElementById("btnViewImage").classList.toggle("active", mode === "image");

      stage.classList.toggle("split-mode", mode === "split");
      if (mode === "graph") {
        vp.style.display = "block";
        imgPane.style.display = "none";
        controls.style.display = "flex";
        setTimeout(resetCamera, 20);
      } else if (mode === "image") {
        vp.style.display = "none";
        imgPane.style.display = "flex";
        controls.style.display = "none";
      } else {
        vp.style.display = "block";
        imgPane.style.display = "flex";
        controls.style.display = "flex";
        setTimeout(resetCamera, 20);
      }
    }

    function toggleWalkthrough() {
      state.walkthrough = !state.walkthrough;
      const btn = document.getElementById("btnToggleWalkthrough");
      btn.textContent = state.walkthrough ? "⏹ 退出单步演进" : "▶ 单步张量演进";
      document.getElementById("walkthroughStatus").textContent = state.walkthrough
        ? `单步演进模式 · Step ${state.stepIndex + 1}/${ARCH_DATA.steps.length}`
        : "探索模式";
      if (state.walkthrough) {
        goStep(state.stepIndex);
      } else {
        renderGraph();
      }
    }

    function goStep(index) {
      const steps = ARCH_DATA.steps || [];
      if (!steps.length) return;
      state.stepIndex = Math.max(0, Math.min(steps.length - 1, index));
      if (!state.walkthrough) {
        state.walkthrough = true;
        document.getElementById("btnToggleWalkthrough").textContent = "⏹ 退出单步演进";
      }
      const step = steps[state.stepIndex];
      if (step.focus_node && state.nodeMap.has(step.focus_node)) {
        state.selectedNodeId = step.focus_node;
      } else if (step.active_nodes && step.active_nodes[0]) {
        state.selectedNodeId = step.active_nodes[0];
      }
      document.getElementById("walkthroughStatus").textContent =
        `单步演进模式 · Step ${state.stepIndex + 1}/${steps.length}`;
      renderStepper();
      renderGraph();
      renderInspector();
    }

    function renderStepper() {
      const steps = ARCH_DATA.steps || [];
      if (!steps.length) {
        document.getElementById("stepperBox").style.display = "none";
        return;
      }
      const s = steps[state.stepIndex];
      const phaseTag = s.phase === "training" ? " · 训练阶段" : s.phase === "inference" ? " · 推理阶段" : "";
      document.getElementById("stepBadge").textContent = `Step ${state.stepIndex + 1} / ${steps.length}${phaseTag}`;
      document.getElementById("stepTitle").textContent = s.title || "";
      document.getElementById("stepNarration").innerHTML = renderInlineMath(s.narration || "");
      document.getElementById("btnPrevStep").disabled = state.stepIndex === 0;
      document.getElementById("btnNextStep").disabled = state.stepIndex === steps.length - 1;

      document.getElementById("stepDots").innerHTML = steps
        .map((st, i) => `
          <button class="step-dot ${i === state.stepIndex ? "active" : ""}" onclick="goStep(${i})">
            ${i + 1}. ${escapeHtml((st.title || "").slice(0, 12))}
          </button>
        `)
        .join("");
    }

    /* ---------------- Right Inspector ---------------- */
    function formatIOList(items) {
      if (!items || !items.length) return `<div class="io-item" style="color:var(--text-muted);">—</div>`;
      return items
        .map((it) => `
          <div class="io-item">
            ${escapeHtml(it.name || "")}
            ${it.shape ? `<span class="io-shape">${escapeHtml(it.shape)}</span>` : ""}
            ${it.dtype ? `<span style="color:var(--text-muted); font-size:10.5px;">(${escapeHtml(it.dtype)})</span>` : ""}
          </div>
        `)
        .join("");
    }

    function renderInspector() {
      const node = state.nodeMap.get(state.selectedNodeId);
      if (!node) return;
      const st = CATEGORY_STYLE[node.category] || CATEGORY_STYLE.encoder;

      document.getElementById("inspectorCategory").innerHTML = `
        <span class="cat-pill" style="background:${st.fill}; color:${st.stroke}; border:1px solid ${st.stroke}33;">
          ${escapeHtml(st.label)}
          ${node.repeat_badge ? ` · ${escapeHtml(node.repeat_badge)}` : ""}
        </span>
      `;
      document.getElementById("inspectorTitle").textContent = node.name || "";
      document.getElementById("inspectorRole").innerHTML = renderInlineMath(node.role || "");

      const io = node.io || {};
      document.getElementById("inspectorIO").innerHTML = `
        <div>
          <div class="io-col-label">输入 Input</div>
          ${formatIOList(io.inputs)}
        </div>
        <div class="io-arrow">→</div>
        <div>
          <div class="io-col-label">输出 Output</div>
          ${formatIOList(io.outputs)}
        </div>
      `;

      const body = document.getElementById("inspectorBody");
      if (state.activeTab === "mechanics") {
        const mech = node.mechanics || {};
        body.innerHTML = `
          <div class="section-block">
            <h4 class="section-label">核心直觉与机制</h4>
            <p class="prose">${renderInlineMath(mech.intuition || "暂无说明。")}</p>
          </div>
          ${mech.formula_latex ? `
            <div class="section-block">
              <h4 class="section-label">数学表达</h4>
              ${renderDisplayMath(mech.formula_latex)}
              ${(mech.formula_notes && mech.formula_notes.length) ? `
                <ul class="bullet-list">
                  ${mech.formula_notes.map((n) => `<li>${renderInlineMath(n)}</li>`).join("")}
                </ul>
              ` : ""}
            </div>
          ` : ""}
          ${mech.pseudocode ? `
            <div class="section-block">
              <h4 class="section-label">PyTorch 风格伪代码</h4>
              <pre class="code-block">${escapeHtml(mech.pseudocode)}</pre>
            </div>
          ` : ""}
        `;
      } else if (state.activeTab === "rationale") {
        const rat = node.rationale || {};
        body.innerHTML = `
          <div class="section-block">
            <h4 class="section-label">为什么需要该模块？</h4>
            <p class="prose">${renderInlineMath(rat.why_here || "暂无说明。")}</p>
          </div>
          ${(rat.alternatives && rat.alternatives.length) ? `
            <div class="section-block">
              <h4 class="section-label">常见替代方案与权衡</h4>
              <ul class="bullet-list">
                ${rat.alternatives.map((a) => `<li>${renderInlineMath(a)}</li>`).join("")}
              </ul>
            </div>
          ` : ""}
          ${rat.ablation_impact ? `
            <div class="section-block">
              <h4 class="section-label">消融直觉（去掉或替换会怎样？）</h4>
              <div class="callout warn">${renderInlineMath(rat.ablation_impact)}</div>
            </div>
          ` : ""}
          ${rat.implementation_notes ? `
            <div class="section-block">
              <h4 class="section-label">工程实现与训练细节</h4>
              <div class="callout">${renderInlineMath(rat.implementation_notes)}</div>
            </div>
          ` : ""}
        `;
      } else {
        const concepts = node.concepts || [];
        const papers = node.papers || [];
        body.innerHTML = `
          <div class="section-block">
            <h4 class="section-label">前置知识点</h4>
            ${concepts.length ? concepts.map((c) => `
              <div class="concept-card">
                <div class="concept-term">${escapeHtml(c.term || "")}</div>
                <p class="concept-brief">${renderInlineMath(c.brief || "")}</p>
              </div>
            `).join("") : `<p class="prose" style="color:var(--text-muted);">该模块无额外前置概念条目。</p>`}
          </div>
          <div class="section-block">
            <h4 class="section-label">关联论文与方法谱系</h4>
            ${papers.length ? papers.map(renderPaperCard).join("") : `<p class="prose" style="color:var(--text-muted);">暂未关联特定论文。</p>`}
          </div>
        `;
      }
      if (node.evidence && node.evidence.length) {
        const labels = { paper: "正文定义", figure: "图中可见", experiment: "实验报告", inference: "解读推断" };
        const entries = node.evidence.map((e) =>
          `<li><strong>${labels[e.kind]} · ${escapeHtml(e.locator)}</strong><br>${renderInlineMath(e.claim)}</li>`
        ).join("");
        body.insertAdjacentHTML("beforeend",
          `<section class="section-block"><h4 class="section-label">原文依据与解读</h4><ul class="bullet-list">${entries}</ul></section>`);
      }
    }

    function renderPaperCard(p) {
      const rel = RELATION_LABEL[p.relation] || RELATION_LABEL.foundational;
      const verifiedBadge = p.verified
        ? `<span class="verify-pill verified">已核验链接</span>`
        : `<span class="verify-pill search">检索入口</span>`;
      const safeUrl =
        p.url ||
        `https://arxiv.org/search/?query=${encodeURIComponent(p.title || "")}&searchtype=all`;
      return `
        <div class="paper-card">
          <div class="paper-top">
            <div class="paper-title">${escapeHtml(p.title || "")}</div>
            <span class="rel-badge ${rel.cls}">${rel.text}</span>
          </div>
          <div class="paper-meta">
            <span>${escapeHtml(p.authors_year || "")}</span>
            ${verifiedBadge}
          </div>
          ${p.takeaway ? `<p class="paper-takeaway">${renderInlineMath(p.takeaway)}</p>` : ""}
          <a class="paper-link" href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer">
            ${p.verified ? "打开论文页面 ↗" : "在学术库中检索该论文 ↗"}
          </a>
        </div>
      `;
    }

    /* ---------------- Appendix ---------------- */
    function renderAppendix() {
      const m = ARCH_DATA.meta || {};
      document.getElementById("overviewSummary").innerHTML = renderInlineMath(m.overview_summary || "");

      // Trace Table
      const sortedNodes = [...ARCH_DATA.nodes].sort(
        (a, b) => (a.stage - b.stage) || ((a.lane || 0) - (b.lane || 0))
      );
      document.getElementById("traceTableBody").innerHTML = sortedNodes
        .map((n) => {
          const ins = ((n.io && n.io.inputs) || []).map((x) => escapeHtml(`${x.name || ""} ${x.shape || ""}`.trim())).join("<br/>") || "—";
          const outs = ((n.io && n.io.outputs) || []).map((x) => escapeHtml(`${x.name || ""} ${x.shape || ""}`.trim())).join("<br/>") || "—";
          return `
            <tr data-node="${escapeHtml(n.id)}">
              <td class="mono">S${n.stage}</td>
              <td><button class="btn btn-sm">${escapeHtml(n.name)}</button></td>
              <td class="mono">${ins}</td>
              <td class="mono" style="color:var(--accent);">${outs}</td>
              <td>${renderInlineMath(n.role || "")}</td>
            </tr>
          `;
        })
        .join("");

      // Deduplicated Bibliography
      const seen = new Set();
      const allPapers = [];
      ARCH_DATA.nodes.forEach((n) => {
        (n.papers || []).forEach((p) => {
          const key = (p.title || "").trim().toLowerCase();
          if (key && !seen.has(key)) {
            seen.add(key);
            allPapers.push(p);
          }
        });
      });
      document.getElementById("bibList").innerHTML = allPapers.length
        ? allPapers.map(renderPaperCard).join("")
        : `<p class="prose" style="color:var(--text-muted);">暂无关联论文条目。</p>`;

      // Glossary
      const glossary = ARCH_DATA.symbol_glossary || [];
      document.getElementById("glossaryGrid").innerHTML = glossary.length
        ? glossary.map((g) => `
            <div class="glossary-item">
              <span class="glossary-sym">${escapeHtml(g.symbol)}</span>
              <span style="font-size:13px; color:var(--text-secondary);">${renderInlineMath(g.meaning)}</span>
            </div>
          `).join("")
        : `<p class="prose" style="color:var(--text-muted);">无额外符号定义。</p>`;

      // Uncertainties
      const uncs = m.uncertainties || [];
      if (uncs.length) {
        document.getElementById("uncertaintyWrap").style.display = "block";
        document.getElementById("uncertaintyList").innerHTML =
          `<ul class="bullet-list" style="margin:0;">${uncs.map((u) => `<li>${renderInlineMath(u)}</li>`).join("")}</ul>`;
      }
    }

    function openLightbox() {
      if (!IMAGE_DATA_URI) return;
      document.getElementById("lightbox").classList.add("open");
    }
    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("open");
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeLightbox();
      if (state.walkthrough && e.key === "ArrowRight") goStep(state.stepIndex + 1);
      if (state.walkthrough && e.key === "ArrowLeft") goStep(state.stepIndex - 1);
    });

    init();
  </script>
</body>
</html>
